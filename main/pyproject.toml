[project]
name = "dgad"
version = "0.1.0"
description = "DGAD: Disagreement-Gated Adaptive Detection, a security layer that inspects LLM prompts before they reach the model."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "psycopg[binary]",
    "redis",
    "httpx",
    "tenacity",
    "slowapi",
    "python-multipart",
    "structlog",
    "prometheus-client",
    "scikit-learn",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "seaborn",
    "joblib",
    "typer",
    "rich",
    "torch",
    "transformers",
    "sentence-transformers",
    "datasets",
    "ollama",
    "anthropic",
    "openai",
    "optuna",
    "nltk",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "hypothesis",
    "ruff",
    "mypy",
    "bandit",
    "pip-audit",
    "pre-commit",
    "detect-secrets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dgad"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Depends(...) in argument defaults is idiomatic FastAPI, not a bug
"src/dgad/api/**" = ["B008"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["dgad"]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.bandit]
exclude_dirs = ["tests"]
