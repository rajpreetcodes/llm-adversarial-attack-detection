ios<\u002Fcode>, <code>zod<\u002Fcode>.<\u002Fp>\n<div style=\"border-left:3px solid #6f9a7c;background:#f2f7f3;padding:10px 14px;margin:14px 0 0;break-inside:avoid\">\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#3d6b4e;font-weight:700;margin-bottom:4px\">Definition of Done<\u002Fdiv>\n<p style=\"margin:0\">All six views work against the live API. The scatter plot updates in real time during a demo.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article id=\"ph13\" style=\"margin:26px 0 0\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:14px;background:#2b3a67;padding:9px 14px;break-inside:avoid;break-after:avoid;font-family:'Segoe UI',Helvetica,sans-serif\">\n<h3 style=\"margin:0;font-size:11.5pt;font-weight:700;color:#fff\"><span style=\"font-family:Consolas,monospace;font-size:9.5pt;color:#a8b4d4;margin-right:11px\">PHASE 13<\u002Fspan>The Evaluation Harness and Ablation Study<\u002Fh3>\n<div style=\"font-size:8.4pt;color:#c3cbe0;white-space:nowrap\">Weeks 12 to 13 · Owner: Dhruv, with all three interpreting results<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:2px 0 0\">\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#2b3a67;font-weight:700;margin:14px 0 4px\">Goal<\u002Fdiv>\n<p>Produce the tables and plots that prove or disprove the thesis claim. <strong>This phase is your actual research contribution. Budget more time than you think.<\u002Fstrong><\u002Fp>\n<sc-if value=\"{{ showPlainEnglish }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#2b3a67;font-weight:700;margin:14px 0 4px\">Plain-English explanation<\u002Fdiv>\n<p>Up to now you built a system. Now you prove it works and, more importantly, that its specific new idea is what makes it work. You do that by switching parts off one at a time and showing the numbers get worse. If turning off the disagreement gate does not hurt performance, the gate is not doing anything and you need to know that before your examiner does.<\u002Fp>\n<\u002Fsc-if>\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#2b3a67;font-weight:700;margin:14px 0 4px\">Steps<\u002Fdiv>\n<ol>\n<li><strong>Now, and only now, unlock the holdout split.<\u002Fstrong> Everything below is measured on data no model and no threshold has ever seen.<\u002Fli>\n<li>Build the ablation grid. Run every configuration through the identical harness:\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"width:8%\">#<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"width:48%\">Configuration<\u002Fsc-raw-th><sc-raw-th scope=\"col\">What it tests<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>Channel A only<\u002Fsc-raw-td><sc-raw-td>Perplexity baseline (Alon and Kamfonas, Jain et al.)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>Channel B only<\u002Fsc-raw-td><sc-raw-td>Embedding classifier baseline<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>ProtectAI DeBERTa v2 only<\u002Fsc-raw-td><sc-raw-td>Off-the-shelf guard model baseline<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>Llama Prompt Guard 2 only<\u002Fsc-raw-td><sc-raw-td>Off-the-shelf guard model baseline<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>5<\u002Fsc-raw-td><sc-raw-td>LLM judge on every prompt<\u002Fsc-raw-td><sc-raw-td>Accuracy ceiling and cost ceiling<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>6<\u002Fsc-raw-td><sc-raw-td>Naive fusion, mean of A and B<\u002Fsc-raw-td><sc-raw-td><strong>The key comparison<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>7<\u002Fsc-raw-td><sc-raw-td>Naive fusion, max of A and B<\u002Fsc-raw-td><sc-raw-td>Alternative naive baseline<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>8<\u002Fsc-raw-td><sc-raw-td>DGAD, gate on A and B, no escalation<\u002Fsc-raw-td><sc-raw-td>Does gating alone help?<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>9<\u002Fsc-raw-td><sc-raw-td>DGAD, A + B, escalate to judge<\u002Fsc-raw-td><sc-raw-td>Core system<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>10<\u002Fsc-raw-td><sc-raw-td>DGAD, A + B + E, escalate to judge<\u002Fsc-raw-td><sc-raw-td>Adds representation offset<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>11<\u002Fsc-raw-td><sc-raw-td>DGAD, A + B + E, escalate to judge + behavioural probe<\u002Fsc-raw-td><sc-raw-td>Full system<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>12<\u002Fsc-raw-td><sc-raw-td>Full system after adversarial loop<\u002Fsc-raw-td><sc-raw-td>Novelty 2 contribution<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fli>\n<li>For <strong>each<\u002Fstrong> configuration report: ROC-AUC, PR-AUC, accuracy, precision, recall, F1, FPR, FNR, FPR on NotInject specifically (over-defense), mean and p95 latency, throughput, and estimated cost per 1,000 prompts.<\u002Fli>\n<li>Report <strong>per attack family<\u002Fstrong>, not just aggregate. Aggregate numbers hide the complementarity story that is your whole argument.<\u002Fli>\n<li><strong>Statistical significance.<\u002Fstrong> Bootstrap confidence intervals on AUC with at least 1,000 resamples. A 0.3 percent AUC difference with overlapping intervals is not a result, and claiming it is will get you caught.<\u002Fli>\n<li>Plot: ROC curves overlaid, the escalation-rate versus AUC trade-off curve, per-family bar charts, cost versus accuracy Pareto frontier, adversarial-loop round-over-round improvement.<\u002Fli>\n<li>Make the whole thing reproducible with one command and a fixed seed. Archive raw results as CSV so the report tables are generated, never hand-typed.<\u002Fli>\n<\u002Fol>\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#2b3a67;font-weight:700;margin:14px 0 4px\">Libraries used<\u002Fdiv>\n<p><code>scikit-learn<\u002Fcode>, <code>scipy<\u002Fcode>, <code>numpy<\u002Fcode>, <code>pandas<\u002Fcode>, <code>matplotlib<\u002Fcode>, <code>seaborn<\u002Fcode>, <code>typer<\u002Fcode>, <code>rich<\u002Fcode>, <code>mlflow<\u002Fcode>.<\u002Fp>\n<div style=\"border-left:3px solid #6f9a7c;background:#f2f7f3;padding:10px 14px;margin:14px 0 0;break-inside:avoid\">\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#3d6b4e;font-weight:700;margin-bottom:4px\">Definition of Done<\u002Fdiv>\n<p style=\"margin:0\">One command regenerates every table and figure in the report from raw results. Confidence intervals on every headline number. <strong>You can state in one sentence what the ablation proves, including any part of it that did not work.<\u002Fstrong><\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article id=\"ph14\" style=\"margin:26px 0 0\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:14px;background:#2b3a67;padding:9px 14px;break-inside:avoid;break-after:avoid;font-family:'Segoe UI',Helvetica,sans-serif\">\n<h3 style=\"margin:0;font-size:11.5pt;font-weight:700;color:#fff\"><span style=\"font-family:Consolas,monospace;font-size:9.5pt;color:#a8b4d4;margin-right:11px\">PHASE 14<\u002Fspan>Red-Teaming Our Own Detector<\u002Fh3>\n<div style=\"font-size:8.4pt;color:#c3cbe0;white-space:nowrap\">Weeks 13 to 14 · Owner: Rajpreet<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:2px 0 0\">\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#2b3a67;font-weight:700;margin:14px 0 4px\">Goal<\u002Fdiv>\n<p>Attack your own system the way Hackett et al. attacked commercial guardrails, and report what breaks.<\u002Fp>\n<sc-if value=\"{{ showPlainEnglish }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#2b3a67;font-weight:700;margin:14px 0 4px\">Plain-English explanation<\u002Fdiv>\n<p>The Hackett et al. paper (your reference [13]) showed that real commercial guardrails could be evaded up to 100 percent of the time in some configurations. If you do not test your own system this way, an examiner will ask why not. Doing it yourself, and reporting the failures honestly, turns a potential weakness into a demonstration of maturity.<\u002Fp>\n<\u002Fsc-if>\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#2b3a67;font-weight:700;margin:14px 0 4px\">Steps<\u002Fdiv>\n<ol>\n<li>Run <strong>garak<\u002Fstrong> against your detection endpoint with its prompt-injection and jailbreak probe families.<\u002Fli>\n<li>Run <strong>promptfoo<\u002Fstrong> red-team scans, wired into CI so regressions are caught automatically.<\u002Fli>\n<li>Hand-build an evasion suite covering the specific techniques from the literature: Unicode homoglyph substitution, zero-width character insertion, base64 and ROT13 encoding, token smuggling, language switching, and progressive paraphrasing.<\u002Fli>\n<li>Attack <strong>each channel individually<\u002Fstrong> and record which evasion beats which channel. A technique that beats Channel A but not Channel B <strong>is caught by your gate<\u002Fstrong>, and demonstrating that specific case is powerful evidence for your design.<\u002Fli>\n<li>Test the judge-hijack path: can a prompt make the judge itself return <code>benign<\u002Fcode>? Report the canary results.<\u002Fli>\n<li>Freeze every discovered evasion as a <strong>permanent regression test<\u002Fstrong> in <code>tests/adversarial/<\u002Fcode>. CI fails if a previously-caught evasion starts passing.<\u002Fli>\n<li>Write the findings section: what evaded, what held, and what you would fix with more time.<\u002Fli>\n<\u002Fol>\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#2b3a67;font-weight:700;margin:14px 0 4px\">Libraries used<\u002Fdiv>\n<p><code>garak<\u002Fcode>, <code>promptfoo<\u002Fcode>, <code>pytest<\u002Fcode>, custom mutators from Phase 10.<\u002Fp>\n<div style=\"border-left:3px solid #6f9a7c;background:#f2f7f3;padding:10px 14px;margin:14px 0 0;break-inside:avoid\">\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#3d6b4e;font-weight:700;margin-bottom:4px\">Definition of Done<\u002Fdiv>\n<p style=\"margin:0\">A written findings table (technique, channel evaded, whether the gate still caught it, mitigation). All evasions are regression tests in CI. <strong>Honest reporting of what still evades you.<\u002Fstrong> Zero findings would be suspicious, not impressive.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n\n<article id=\"ph15\" style=\"margin:26px 0 0\">\n<div style=\"display:flex;justify-content:space-between;align-items:baseline;gap:14px;background:#2b3a67;padding:9px 14px;break-inside:avoid;break-after:avoid;font-family:'Segoe UI',Helvetica,sans-serif\">\n<h3 style=\"margin:0;font-size:11.5pt;font-weight:700;color:#fff\"><span style=\"font-family:Consolas,monospace;font-size:9.5pt;color:#a8b4d4;margin-right:11px\">PHASE 15<\u002Fspan>Report, Deliverables, and Viva Preparation<\u002Fh3>\n<div style=\"font-size:8.4pt;color:#c3cbe0;white-space:nowrap\">Weeks 14 to 16 · Owner: all three<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"padding:2px 0 0\">\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#2b3a67;font-weight:700;margin:14px 0 4px\">Goal<\u002Fdiv>\n<p>Ship the five deliverables promised in the synopsis, plus defend the work.<\u002Fp>\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#2b3a67;font-weight:700;margin:14px 0 4px\">Steps<\u002Fdiv>\n<ol>\n<li><strong>Benchmark dataset<\u002Fstrong> deliverable: publish your unified dataset schema, the build script, and per-source documentation. Do not redistribute source data that the license forbids redistributing; ship the builder instead. Note that explicitly, it shows legal awareness.<\u002Fli>\n<li><strong>Detection engine<\u002Fstrong> deliverable: the packaged API with a README and an OpenAPI spec.<\u002Fli>\n<li><strong>Dashboard<\u002Fstrong> deliverable: deployed and screenshotted.<\u002Fli>\n<li><strong>Proxy middleware<\u002Fstrong> deliverable: with the one-line integration example.<\u002Fli>\n<li><strong>Evaluation report<\u002Fstrong> deliverable: all tables and figures from Phase 13 plus the red-team findings from Phase 14.<\u002Fli>\n<li>Update the synopsis text: Section 4.1 (Research Gap) and Section 6 (Objectives) need rewriting to describe the disagreement-gated mechanism. Add three references: DataSentinel, The Consistency Confound, and ROD. Everything else in the synopsis stands.<\u002Fli>\n<li>Write <code>docs/viva_prep.md<\u002Fcode>. Each member must be able to answer every question in Section 9 below, not just the ones about their own slice.<\u002Fli>\n<li>Do at least two full dry-run demos on a machine that is <strong>not<\u002Fstrong> your dev laptop. Demos fail on unseeded databases and missing environment variables; find that out in advance.<\u002Fli>\n<\u002Fol>\n<div style=\"border-left:3px solid #6f9a7c;background:#f2f7f3;padding:10px 14px;margin:14px 0 0;break-inside:avoid\">\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#3d6b4e;font-weight:700;margin-bottom:4px\">Definition of Done<\u002Fdiv>\n<p style=\"margin:0\">All five deliverables exist. Every team member can explain the disagreement gate. Two successful dry runs on a clean machine.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Farticle>\n<\u002Fsection>\n\n<section id=\"p8\" style=\"break-before:page\">\n<h2 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:16pt;font-weight:700;color:#1f2a4d;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid #2b3a67;line-height:1.25\"><span style=\"font-family:Consolas,monospace;font-size:13pt;color:#2b3a67;margin-right:12px\">8<\u002Fspan>CAMS: The DevOps Procedure<\u002Fh2>\n<p>CAMS stands for <strong>Culture, Automation, Measurement, Sharing<\u002Fstrong>. It is the standard framework describing what DevOps actually is, beyond tooling. It was coined by Damon Edwards and John Willis. Each pillar below has concrete, checkable practices for this project, so it appears in your report as a real methodology and not a paragraph of buzzwords.<\u002Fp>\n<h3 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:11.5pt;font-weight:700;color:#2b3a67;margin:20px 0 6px\">8.1 C for Culture<\u002Fh3>\n<p><strong>Plain-English explanation.<\u002Fstrong> Culture means how the three of you work together, and specifically that nobody becomes a bottleneck or a hero. In a three-person student project the number one cause of failure is one person owning something critical and going quiet during exams.<\u002Fp>\n<p><strong>Practices for this project:<\u002Fstrong><\u002Fp>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"width:28%\">Practice<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Concrete rule<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td>Shared ownership<\u002Fsc-raw-td><sc-raw-td>Every module has an owner <strong>and<\u002Fstrong> a named reviewer. The reviewer must be able to run and explain that module.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>No self-merges<\u002Fsc-raw-td><sc-raw-td>Every PR needs one approving review from another member. No exceptions, including for \"trivial\" changes.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Blameless post-mortems<\u002Fsc-raw-td><sc-raw-td>When something breaks (a bad merge, a lost result, a failed demo), write a short note in <code>docs/adr/<\u002Fcode> on what happened and what changed to prevent it. Focus on the process, never the person.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Weekly sync<\u002Fsc-raw-td><sc-raw-td>30 minutes, fixed slot, three questions each: what I finished, what I am doing next, what is blocking me. Minutes go in the repo.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Definition of Done is written down<\u002Fsc-raw-td><sc-raw-td>A phase is done when its DoD in this document passes, not when someone feels it is done.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Rotate the pain<\u002Fsc-raw-td><sc-raw-td>Whoever ships a feature also writes its tests and its docs. No \"I code, you test\" split.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Fail fast, tell early<\u002Fsc-raw-td><sc-raw-td>If you are stuck for more than half a day, say so in the group. Silent blocking is the most expensive failure mode you have.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<h3 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:11.5pt;font-weight:700;color:#2b3a67;margin:20px 0 6px\">8.2 A for Automation<\u002Fh3>\n<p><strong>Plain-English explanation.<\u002Fstrong> Automation means a computer does anything you would otherwise do more than twice by hand. Every manual step is a step someone will forget the night before submission.<\u002Fp>\n<p><strong>Practices for this project:<\u002Fstrong><\u002Fp>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"width:26%\">What is automated<\u002Fsc-raw-th><sc-raw-th scope=\"col\">How<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td>Code quality<\u002Fsc-raw-td><sc-raw-td><code>pre-commit<\u002Fcode> hooks run <code>ruff<\u002Fcode> (lint + format), <code>mypy<\u002Fcode> (types), and <code>detect-secrets<\u002Fcode> before every commit. You physically cannot commit unformatted code or a leaked API key.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Testing<\u002Fsc-raw-td><sc-raw-td><code>pytest<\u002Fcode> runs on every push via GitHub Actions. Unit tests must pass to merge.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Dataset build<\u002Fsc-raw-td><sc-raw-td><code>python -m dgad.eval.datasets --build<\u002Fcode> reproduces every split from a fixed seed. Nobody hand-edits a CSV, ever.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Model training<\u002Fsc-raw-td><sc-raw-td>One command per channel, with all parameters from config, all runs logged to MLflow.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Evaluation<\u002Fsc-raw-td><sc-raw-td><code>python -m dgad.eval.runner --all<\u002Fcode> regenerates the entire ablation grid and every figure. Report tables are generated files, never hand-typed.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Security scanning<\u002Fsc-raw-td><sc-raw-td><code>pip-audit<\u002Fcode> for vulnerable dependencies and <code>bandit<\u002Fcode> for insecure Python patterns run in CI weekly and on every push.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Adversarial regression<\u002Fsc-raw-td><sc-raw-td><code>pytest tests/adversarial/<\u002Fcode> runs every known evasion. CI fails if a previously-blocked attack starts passing.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Container build<\u002Fsc-raw-td><sc-raw-td><code>docker build<\u002Fcode> in CI on every push to <code>main<\u002Fcode>, so the image is always known-good.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Nightly benchmark<\u002Fsc-raw-td><sc-raw-td>A scheduled GitHub Action runs the full evaluation on the validation split and posts the metrics. Catches silent regressions the same day they land.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Database migrations<\u002Fsc-raw-td><sc-raw-td><code>alembic<\u002Fcode> handles all schema changes. Nobody runs manual SQL against a shared database.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<div style=\"border:1px solid #dfe3ec;border-left:3px solid #2b3a67;background:#f6f7fb;padding:11px 15px;margin:14px 0;break-inside:avoid\">\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#2b3a67;font-weight:700;margin-bottom:5px\">The rule of three<\u002Fdiv>\n<p style=\"margin:0\">If you do something manually for the third time, automate it that day.<\u002Fp>\n<\u002Fdiv>\n<h3 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:11.5pt;font-weight:700;color:#2b3a67;margin:20px 0 6px\">8.3 M for Measurement<\u002Fh3>\n<p><strong>Plain-English explanation.<\u002Fstrong> Measurement means you can answer \"is it working, and is it better than yesterday\" with a number instead of an opinion. For a security project this is doubly important because \"it feels accurate\" is not a defensible statement at a viva.<\u002Fp>\n<p><strong>What this project measures, and where:<\u002Fstrong><\u002Fp>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"width:22%\">Category<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"width:50%\">Metrics<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Where it lives<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td><strong>Detection quality<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>ROC-AUC, PR-AUC, accuracy, precision, recall, F1, FPR, FNR, per attack family<\u002Fsc-raw-td><sc-raw-td>MLflow + the eval report<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Over-defense<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>FPR on NotInject specifically, tracked separately from overall FPR<\u002Fsc-raw-td><sc-raw-td>Eval report<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Calibration<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Expected Calibration Error, reliability diagrams, per channel<\u002Fsc-raw-td><sc-raw-td>Eval report<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Gate behaviour<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Escalation rate, agreement rate, disagreement distribution, decision mix<\u002Fsc-raw-td><sc-raw-td>Prometheus + dashboard<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Operational<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>p50 / p95 / p99 latency per channel and end to end, throughput (prompts/sec), cache hit rate<\u002Fsc-raw-td><sc-raw-td>Prometheus + Grafana or the dashboard<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Cost<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>API calls per 1,000 prompts, estimated currency cost per 1,000 prompts, DGAD vs judge-on-everything<\u002Fsc-raw-td><sc-raw-td>Eval report<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Robustness<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Evasion success rate per technique, before and after the adversarial loop<\u002Fsc-raw-td><sc-raw-td>Red-team findings table<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Engineering health<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Test coverage percentage, CI pass rate, open PR age, mean time to fix a red build<\u002Fsc-raw-td><sc-raw-td>GitHub Actions + <code>pytest-cov<\u002Fcode><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Adversarial loop<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>False-agreement rate per round, hard negatives found per round, performance on untouched families<\u002Fsc-raw-td><sc-raw-td>MLflow<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<div style=\"border:1px solid #e3cdd0;border-left:3px solid #9d5560;background:#fdf6f7;padding:11px 15px;margin:14px 0;break-inside:avoid\">\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#8b414d;font-weight:700;margin-bottom:5px\">Important<\u002Fdiv>\n<p style=\"margin:0\">Set your target numbers with Dr. Sharma before Phase 13, and write them down. The synopsis deliberately contains no hard numeric targets. Agree them with your mentor, record them in the repo, and then report your achieved numbers against them honestly. Do not invent targets retroactively to match whatever you achieved; that is the one thing that will destroy your credibility if noticed.<\u002Fp>\n<\u002Fdiv>\n<h3 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:11.5pt;font-weight:700;color:#2b3a67;margin:20px 0 6px\">8.4 S for Sharing<\u002Fh3>\n<p><strong>Plain-English explanation.<\u002Fstrong> Sharing means knowledge does not live in one person's head or one person's laptop. If Sumit gets sick in week 14, the other two must be able to deploy.<\u002Fp>\n<p><strong>Practices for this project:<\u002Fstrong><\u002Fp>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"width:28%\">Practice<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Concrete rule<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td>Architecture Decision Records<\u002Fsc-raw-td><sc-raw-td>Every non-obvious choice gets a one-page ADR in <code>docs/adr/<\u002Fcode>: what we decided, what we considered, why. These become your report's design-rationale chapter with almost no rewriting.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Runbook<\u002Fsc-raw-td><sc-raw-td><code>docs/runbook.md<\u002Fcode> covers: how to set up from scratch, how to build data, how to train, how to run eval, how to deploy, and what to do when each known thing breaks.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Everything in the repo<\u002Fsc-raw-td><sc-raw-td>Meeting minutes, mentor feedback, decisions, findings. No project knowledge in WhatsApp or in one person's notebook.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>README that actually works<\u002Fsc-raw-td><sc-raw-td>A new person clones the repo and gets a running system by following the README only. <strong>Test this by having a teammate try it on a clean machine.<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Docstrings on public functions<\u002Fsc-raw-td><sc-raw-td>Especially in <code>gate.py<\u002Fcode> and <code>calibration.py<\u002Fcode>, where the logic is subtle.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Demo recordings<\u002Fsc-raw-td><sc-raw-td>Record each milestone demo. Protects you if a live demo fails on the day.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Mentor updates<\u002Fsc-raw-td><sc-raw-td>A short written status to Dr. Sharma at each phase boundary: what shipped, what the numbers are, what is blocked. Written updates create a paper trail of consistent progress.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<h3 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:11.5pt;font-weight:700;color:#2b3a67;margin:20px 0 6px\">8.5 The CI/CD Pipeline<\u002Fh3>\n<figure style=\"break-inside:avoid\">\n<svg sc-camel-view-box=\"0 0 640 752\" role=\"img\" aria-label=\"Figure 3: the CI/CD pipeline from developer commit to nightly benchmark\" style=\"width:100%\">\n<defs><marker id=\"f3a\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"9\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"#5c6478\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n<g fill=\"none\" stroke=\"#5c6478\" stroke-width=\"1.2\" marker-end=\"url(#f3a)\">\n<path d=\"M320,40 V56\"><\u002Fpath>\n<path d=\"M320,104 V120\"><\u002Fpath>\n<path d=\"M320,152 V162\"><\u002Fpath>\n<path d=\"M86,242 V254\"><\u002Fpath>\n<path d=\"M242,242 V254\"><\u002Fpath>\n<path d=\"M398,242 V254\"><\u002Fpath>\n<path d=\"M554,242 V254\"><\u002Fpath>\n<path d=\"M320,322 V334\"><\u002Fpath>\n<path d=\"M320,368 V384\"><\u002Fpath>\n<path d=\"M320,432 V450\"><\u002Fpath>\n<path d=\"M320,484 V500\"><\u002Fpath>\n<path d=\"M320,534 V550\"><\u002Fpath>\n<path d=\"M320,584 V600\"><\u002Fpath>\n<path d=\"M320,634 V650\"><\u002Fpath>\n<path d=\"M320,684 V700\"><\u002Fpath>\n<\u002Fg>\n<g fill=\"none\" stroke=\"#5c6478\" stroke-width=\"1.2\">\n<path d=\"M320,228 V242 M86,242 H554\"><\u002Fpath>\n<path d=\"M86,308 V322 M554,308 V322 M242,308 V322 M398,308 V322 M86,322 H554\"><\u002Fpath>\n<\u002Fg>\n<g font-family=\"'Segoe UI',Helvetica,sans-serif\" fill=\"#1f2a4d\">\n<rect x=\"225\" y=\"6\" width=\"190\" height=\"34\" rx=\"3\" fill=\"#fff\" stroke=\"#c3cadb\"><\u002Frect><text x=\"320\" y=\"28\" font-size=\"12\" text-anchor=\"middle\">Developer commits<\u002Ftext>\n<rect x=\"200\" y=\"56\" width=\"240\" height=\"48\" rx=\"3\" fill=\"#f4f6fa\" stroke=\"#c3cadb\"><\u002Frect><text x=\"320\" y=\"76\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\">pre-commit<\u002Ftext><text x=\"320\" y=\"93\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5266\">ruff, mypy, detect-secrets<\u002Ftext>\n<rect x=\"215\" y=\"120\" width=\"210\" height=\"32\" rx=\"3\" fill=\"#fff\" stroke=\"#c3cadb\"><\u002Frect><text x=\"320\" y=\"141\" font-size=\"11.5\" text-anchor=\"middle\">Push to feature branch<\u002Ftext>\n<path d=\"M320,162 L432,196 L320,230 L208,196 Z\" fill=\"#2b3a67\"><\u002Fpath><text x=\"320\" y=\"200\" font-size=\"11.5\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\">GitHub Actions CI<\u002Ftext>\n<rect x=\"12\" y=\"254\" width=\"148\" height=\"54\" rx=\"3\" fill=\"#f4f6fa\" stroke=\"#c3cadb\"><\u002Frect><text x=\"86\" y=\"277\" font-size=\"10.5\" text-anchor=\"middle\">Lint +<\u002Ftext><text x=\"86\" y=\"292\" font-size=\"10.5\" text-anchor=\"middle\">type check<\u002Ftext>\n<rect x=\"168\" y=\"254\" width=\"148\" height=\"54\" rx=\"3\" fill=\"#f4f6fa\" stroke=\"#c3cadb\"><\u002Frect><text x=\"242\" y=\"277\" font-size=\"10.5\" text-anchor=\"middle\">Unit + integration<\u002Ftext><text x=\"242\" y=\"292\" font-size=\"10.5\" text-anchor=\"middle\">tests<\u002Ftext>\n<rect x=\"324\" y=\"254\" width=\"148\" height=\"54\" rx=\"3\" fill=\"#f4f6fa\" stroke=\"#c3cadb\"><\u002Frect><text x=\"398\" y=\"277\" font-size=\"10.5\" text-anchor=\"middle\">bandit +<\u002Ftext><text x=\"398\" y=\"292\" font-size=\"10.5\" text-anchor=\"middle\">pip-audit<\u002Ftext>\n<rect x=\"480\" y=\"254\" width=\"148\" height=\"54\" rx=\"3\" fill=\"#f4f6fa\" stroke=\"#c3cadb\"><\u002Frect><text x=\"554\" y=\"277\" font-size=\"10.5\" text-anchor=\"middle\">Adversarial<\u002Ftext><text x=\"554\" y=\"292\" font-size=\"10.5\" text-anchor=\"middle\">regression suite<\u002Ftext>\n<rect x=\"235\" y=\"334\" width=\"170\" height=\"34\" rx=\"3\" fill=\"#fff\" stroke=\"#c3cadb\"><\u002Frect><text x=\"320\" y=\"356\" font-size=\"11.5\" text-anchor=\"middle\">Pull request<\u002Ftext>\n<rect x=\"195\" y=\"384\" width=\"250\" height=\"48\" rx=\"3\" fill=\"#fff\" stroke=\"#c3cadb\"><\u002Frect><text x=\"320\" y=\"404\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\">Peer review<\u002Ftext><text x=\"320\" y=\"421\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5266\">1 approval required<\u002Ftext>\n<rect x=\"205\" y=\"450\" width=\"230\" height=\"34\" rx=\"3\" fill=\"#fff\" stroke=\"#2b3a67\" stroke-width=\"1.4\"><\u002Frect><text x=\"320\" y=\"472\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\">Squash merge to main<\u002Ftext>\n<rect x=\"225\" y=\"500\" width=\"190\" height=\"34\" rx=\"3\" fill=\"#fff\" stroke=\"#c3cadb\"><\u002Frect><text x=\"320\" y=\"522\" font-size=\"11.5\" text-anchor=\"middle\">Docker image build<\u002Ftext>\n<rect x=\"215\" y=\"550\" width=\"210\" height=\"34\" rx=\"3\" fill=\"#fff\" stroke=\"#c3cadb\"><\u002Frect><text x=\"320\" y=\"572\" font-size=\"11.5\" text-anchor=\"middle\">Deploy to staging<\u002Ftext>\n<rect x=\"200\" y=\"600\" width=\"240\" height=\"34\" rx=\"3\" fill=\"#fff\" stroke=\"#c3cadb\"><\u002Frect><text x=\"320\" y=\"622\" font-size=\"11.5\" text-anchor=\"middle\">Smoke test + health check<\u002Ftext>\n<rect x=\"205\" y=\"650\" width=\"230\" height=\"34\" rx=\"3\" fill=\"#fdfbf4\" stroke=\"#a58a3f\"><\u002Frect><text x=\"320\" y=\"672\" font-size=\"11.5\" text-anchor=\"middle\">Nightly full benchmark<\u002Ftext>\n<rect x=\"210\" y=\"700\" width=\"220\" height=\"42\" rx=\"6\" fill=\"#f2f3f7\" stroke=\"#c3cadb\"><\u002Frect><text x=\"320\" y=\"727\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\">MLflow + Prometheus<\u002Ftext>\n<\u002Fg>\n<\u002Fsvg>\n<figcaption><strong style=\"color:#2b3a67\">Figure 3.<\u002Fstrong> The CI/CD pipeline. Four independent CI jobs, including the adversarial regression suite, must pass before a pull request can be reviewed; nothing reaches <code>main<\u002Fcode> without one peer approval, and the nightly benchmark writes every metric back into MLflow and Prometheus.<\u002Ffigcaption>\n<\u002Ffigure>\n<p><strong>Pipeline stages in plain words:<\u002Fstrong><\u002Fp>\n<ol>\n<li><strong>pre-commit<\u002Fstrong> stops bad code leaving your machine. Runs in seconds.<\u002Fli>\n<li><strong>CI on push<\u002Fstrong> stops bad code entering the shared branch. Runs in a few minutes.<\u002Fli>\n<li><strong>Peer review<\u002Fstrong> stops code nobody else understands entering the shared branch. Runs in a day.<\u002Fli>\n<li><strong>Build and deploy<\u002Fstrong> proves the thing actually runs somewhere other than your laptop.<\u002Fli>\n<li><strong>Nightly benchmark<\u002Fstrong> stops silent quality regressions, the kind where accuracy quietly drops two points and nobody notices for three weeks.<\u002Fli>\n<\u002Fol>\n<\u002Fsection>\n\n<section id=\"p9\">\n<h2 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:16pt;font-weight:700;color:#1f2a4d;margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid #2b3a67;line-height:1.25\"><span style=\"font-family:Consolas,monospace;font-size:13pt;color:#2b3a67;margin-right:12px\">9<\u002Fspan>Viva Preparation: Questions You Will Be Asked<\u002Fh2>\n<p>Write your answers in <code>docs/viva_prep.md<\u002Fcode>. Every member answers all of them, not just their own slice.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr;gap:0\">\n<h4 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt;font-weight:700;color:#1f2a4d;margin:16px 0 2px;letter-spacing:.03em\">On novelty<\u002Fh4>\n<ol style=\"margin:4px 0 0\">\n<li>What exactly is new here, in one sentence?<\u002Fli>\n<li>How is this different from just running several detectors and averaging?<\u002Fli>\n<li>DataSentinel already does adversarial training for injection detection. How are you different?<\u002Fli>\n<li>Is your behavioural probe not the same as the semantic-entropy method that was shown to fail?<\u002Fli>\n<li>ROD already measures intent offset. What is your contribution over it?<\u002Fli>\n<\u002Fol>\n<h4 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt;font-weight:700;color:#1f2a4d;margin:16px 0 2px;letter-spacing:.03em\">On method<\u002Fh4>\n<ol start=\"6\" style=\"margin:4px 0 0\">\n<li>Why does calibration have to come before the disagreement gate?<\u002Fli>\n<li>How did you choose your thresholds, and how do you know they are not overfitted?<\u002Fli>\n<li>What happens when both cheap channels are wrong in the same direction?<\u002Fli>\n<li>Why is your escalation rate the number it is? What happens if you halve it?<\u002Fli>\n<li>Your behavioural probe uses a small proxy model, not the protected model. Why is that valid?<\u002Fli>\n<\u002Fol>\n<h4 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt;font-weight:700;color:#1f2a4d;margin:16px 0 2px;letter-spacing:.03em\">On evaluation<\u002Fh4>\n<ol start=\"11\" style=\"margin:4px 0 0\">\n<li>How do you know there is no data leakage between your splits?<\u002Fli>\n<li>Your AUC is X. What is the confidence interval, and is the gap to naive fusion significant?<\u002Fli>\n<li>What is your false-positive rate on prompts that merely contain trigger words?<\u002Fli>\n<li>Which attack family do you perform worst on, and why?<\u002Fli>\n<li>What did the ablation show does <strong>not<\u002Fstrong> contribute? (Have a real answer. \"Everything helped\" reads as untested.)<\u002Fli>\n<\u002Fol>\n<h4 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt;font-weight:700;color:#1f2a4d;margin:16px 0 2px;letter-spacing:.03em\">On security<\u002Fh4>\n<ol start=\"16\" style=\"margin:4px 0 0\">\n<li>Your detector is itself an attack surface. What happens if someone attacks the LLM judge?<\u002Fli>\n<li>What evaded your system in the red-team phase?<\u002Fli>\n<li>What is the failure mode if the judge API goes down?<\u002Fli>\n<li>Do you store user prompts? What are the privacy implications?<\u002Fli>\n<\u002Fol>\n<h4 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt;font-weight:700;color:#1f2a4d;margin:16px 0 2px;letter-spacing:.03em\">On engineering<\u002Fh4>\n<ol start=\"20\" style=\"margin:4px 0 0\">\n<li>Walk me through what happens to a single request, end to end.<\u002Fli>\n<li>How would someone deploy this in front of an existing application?<\u002Fli>\n<li>How do you know a change did not break detection quality?<\u002Fli>\n<\u002Fol>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"p10\">\n<h2 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:16pt;font-weight:700;color:#1f2a4d;margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid #2b3a67;line-height:1.25\"><span style=\"font-family:Consolas,monospace;font-size:13pt;color:#2b3a67;margin-right:12px\">10<\u002Fspan>Risk Register<\u002Fh2>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"width:5%\">#<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"width:23%\">Risk<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"width:11%\">Likelihood<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"width:10%\">Impact<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Mitigation<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>DGAD does not beat naive fusion<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>This is a legitimate finding. Pivot the report to a rigorous negative result plus the cost analysis, where DGAD almost certainly still wins. Never fake the numbers.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>Escalation rate too high, so no cost advantage<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Tune thresholds as an explicit constrained optimisation. Report the full trade-off curve rather than one operating point.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>Channel C (behavioural probe) adds nothing<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Low<\u002Fsc-raw-td><sc-raw-td>Expected, given the Consistency Confound result. Report it as a null result, reduce its weight, keep the analysis.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>GCG reproduction blocked by 6 GB VRAM<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Use published AdvBench suffixes instead of generating your own; budget one cloud GPU session if you want fresh ones. Not on the critical path.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>5<\u002Fsc-raw-td><sc-raw-td>Gated model access (Llama Guard, Prompt Guard, LMSYS) delayed<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Request access in <strong>week 1<\u002Fstrong>, not week 10. Have ProtectAI DeBERTa as the ungated fallback baseline.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>6<\u002Fsc-raw-td><sc-raw-td>LLM judge API costs blow the budget<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Cache aggressively; run a local Ollama judge in dev; only use the paid judge for final evaluation runs.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>7<\u002Fsc-raw-td><sc-raw-td>Data leakage inflates results<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Very High<\u002Fsc-raw-td><sc-raw-td>Group-split, near-duplicate removal, locked holdout. Test for leakage explicitly and report the test.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>8<\u002Fsc-raw-td><sc-raw-td>One member falls behind during exams<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Weekly sync surfaces it early. Named reviewer per module means someone else can pick it up.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>9<\u002Fsc-raw-td><sc-raw-td>Adversarial loop overfits to its own mutators<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>Hold out attack families the loop never touches; verify no degradation on them.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>10<\u002Fsc-raw-td><sc-raw-td>Scope creep into multi-turn or multimodal<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>The synopsis explicitly excludes these. Point at Section 6 and say no.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>11<\u002Fsc-raw-td><sc-raw-td>Demo fails on the day<\u002Fsc-raw-td><sc-raw-td>Medium<\u002Fsc-raw-td><sc-raw-td>High<\u002Fsc-raw-td><sc-raw-td>Two dry runs on a clean machine; recorded backup demo; seeded demo database.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fsection>\n\n<section id=\"p11\">\n<h2 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:16pt;font-weight:700;color:#1f2a4d;margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid #2b3a67;line-height:1.25\"><span style=\"font-family:Consolas,monospace;font-size:13pt;color:#2b3a67;margin-right:12px\">11<\u002Fspan>Timeline<\u002Fh2>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"width:14%\">Week<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"width:12%\">Phase<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Key output<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>0, 1<\u002Fsc-raw-td><sc-raw-td>Repo, CI, Docker, first ADR; dataset loaders started<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>2<\u002Fsc-raw-td><sc-raw-td>1<\u002Fsc-raw-td><sc-raw-td>Unified dataset, splits, leakage tests, <code>data/README.md<\u002Fcode><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>3<\u002Fsc-raw-td><sc-raw-td>2, 3<\u002Fsc-raw-td><sc-raw-td>Channels A and B working, per-family complementarity table<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>4<\u002Fsc-raw-td><sc-raw-td>Calibration layer, reliability diagrams<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>5<\u002Fsc-raw-td><sc-raw-td>5<\u002Fsc-raw-td><sc-raw-td><strong>Disagreement gate, escalation-rate vs AUC curve<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>6<\u002Fsc-raw-td><sc-raw-td>6, 7<\u002Fsc-raw-td><sc-raw-td>Behavioural probe, LLM judge<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>7<\u002Fsc-raw-td><sc-raw-td>8<\u002Fsc-raw-td><sc-raw-td>Representation offset channel, three-channel gate<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>8<\u002Fsc-raw-td><sc-raw-td>9<\u002Fsc-raw-td><sc-raw-td>Canary tripwire, BIPIA results<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>9 to 10<\u002Fsc-raw-td><sc-raw-td>10<\u002Fsc-raw-td><sc-raw-td><strong>Self-adversarial loop, round-over-round hardening plot<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>10 to 11<\u002Fsc-raw-td><sc-raw-td>11<\u002Fsc-raw-td><sc-raw-td>API, proxy, storage, observability<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>11 to 12<\u002Fsc-raw-td><sc-raw-td>12<\u002Fsc-raw-td><sc-raw-td>Dashboard with the disagreement scatter plot<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>12 to 13<\u002Fsc-raw-td><sc-raw-td>13<\u002Fsc-raw-td><sc-raw-td><strong>Full ablation on the holdout, all tables and figures<\u002Fstrong><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>13 to 14<\u002Fsc-raw-td><sc-raw-td>14<\u002Fsc-raw-td><sc-raw-td>Red-team findings, regression suite<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>14 to 16<\u002Fsc-raw-td><sc-raw-td>15<\u002Fsc-raw-td><sc-raw-td>Report, deliverables, dry runs, viva prep<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<div style=\"border:1px solid #dfe3ec;border-left:3px solid #2b3a67;background:#f6f7fb;padding:11px 15px;margin:14px 0;break-inside:avoid\">\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#2b3a67;font-weight:700;margin-bottom:5px\">Critical path<\u002Fdiv>\n<p style=\"margin:0\">Phases 1, then 2 and 3, then 4, then 5, then 13. Everything else can slip a week without sinking the project. <strong>Phase 4 (calibration) and Phase 5 (the gate) cannot slip<\u002Fstrong>, because every downstream result depends on them.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"p12\">\n<h2 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:16pt;font-weight:700;color:#1f2a4d;margin:30px 0 10px;padding-bottom:6px;border- w-tr><sc-raw-td><strong>Python, reporting<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><code>matplotlib<\u002Fcode>, <code>seaborn<\u002Fcode>, <code>rich<\u002Fcode>, <code>typer<\u002Fcode>, <code>joblib<\u002Fcode><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Node<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td><code>react<\u002Fcode>, <code>react-dom<\u002Fcode>, <code>vite<\u002Fcode>, <code>typescript<\u002Fcode>, <code>tailwindcss<\u002Fcode>, <code>@mui/material<\u002Fcode>, <code>recharts<\u002Fcode>, <code>@tanstack/react-query<\u002Fcode>, <code>axios<\u002Fcode>, <code>zod<\u002Fcode>, <code>promptfoo<\u002Fcode><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Infrastructure<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Docker, Docker Compose, PostgreSQL, Redis, GitHub Actions, <code>uv<\u002Fcode><\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fsection>\n\n<section id=\"appc\">\n<h2 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:16pt;font-weight:700;color:#1f2a4d;margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid #2b3a67;line-height:1.25\"><span style=\"font-family:Consolas,monospace;font-size:13pt;color:#2b3a67;margin-right:12px\">C<\u002Fspan>Prompt For Converting This Document Into A Presentable PDF<\u002Fh2>\n<p>Paste the prompt below into Claude, and attach or paste this <code>final_plan.md<\u002Fcode> alongside it.<\u002Fp>\n<pre style=\"margin:14px 0;background:#f6f7f9;border-left:3px solid #2b3a67;padding:12px 15px;font-family:Consolas,'Liberation Mono',Menlo,monospace;font-size:8.1pt;line-height:1.5;color:#22262f;white-space:pre-wrap;overflow-wrap:break-word\">You are a technical document designer. I am attaching a Markdown implementation plan\nfor a final-year university capstone project in cybersecurity. Convert it into a single\nself-contained HTML file that prints to a beautiful, professional PDF.\n\nCONTEXT\nThe document is the complete build plan for \"DGAD: Disagreement-Gated Adaptive Detection\",\nan adversarial attack detection system for Large Language Models. The audience is a project\nmentor (Dr. Ruchi Sharma), an examination panel, and the three students building it. It must\nlook like a serious engineering specification, not a blog post.\n\nHARD REQUIREMENTS\n1. ONE self-contained HTML file. All CSS inline in a &lt;style&gt; block. No external stylesheets,\n   no CDN links, no web fonts loaded over the network. It must render identically offline.\n2. It must print correctly to A4 via the browser's \"Print to PDF\". Use @page rules with\n   proper margins (20mm), and @media print rules.\n3. Never emit the em dash character. Use colons, semicolons, commas, or parentheses instead.\n   This is an absolute constraint. Check the output for the character before returning it.\n4. Preserve ALL content. Do not summarise, do not drop rows from tables, do not shorten\n   the appendices. Every URL must remain and must remain clickable.\n5. Render the Mermaid diagrams. Since no external scripts are allowed, redraw each Mermaid\n   flowchart as clean inline SVG that matches the described flow exactly. There are three\n   diagrams: the main request flow, the canary tripwire flow, and the CI/CD pipeline.\n\nDESIGN DIRECTION\n- Aesthetic: precise, technical, restrained. Think a well-typeset security whitepaper or an\n  IEEE technical report, not a marketing deck.\n- Typography: a serif family for body text (Georgia or a similar system serif stack) and a\n  clean sans-serif for headings and tables. Monospace for code, file paths, and library names.\n  Body text around 10.5pt to 11pt for print density. Generous line height, around 1.6.\n- Colour: mostly black on white for print economy. One restrained accent colour, a deep\n  indigo or slate blue, used only for headings, table header rows, links, and rules.\n  Attack-related callouts may use a muted red accent; success or \"done\" callouts a muted green.\n- Tables: this document is table-heavy and the tables are the most important content. Style\n  them carefully. Header row with the accent background and white text, subtle zebra striping,\n  no heavy borders, comfortable cell padding, and left-aligned text. Tables must never overflow\n  the page width; allow long URLs to wrap.\n- Code blocks and the directory tree: light neutral background, thin left accent border,\n  monospace, and they must not break awkwardly across pages.\n- Callouts: style the \"Warning\", \"Note\", and \"Important\" blocks as bordered callout boxes with\n  a left accent rule and a small label.\n\nSTRUCTURE AND NAVIGATION\n- Add a title page: project title, subtitle, institution, team members with roll numbers,\n  mentor name, plan version and date. Keep it clean and centred, with generous whitespace.\n- Add an auto-generated table of contents with section numbers and dotted leaders, on its\n  own page after the title page.\n- Number all sections and all figures.\n- Add a running footer on every printed page with the project name on the left and the page\n  number on the right. Use CSS counters.\n- Start each of Part 7 (implementation phases), Part 8 (CAMS) and the Appendices on a new page.\n- Each of the sixteen phases should be visually distinct: a phase header band showing the\n  phase number, its title, its week range, and its owner. The Goal, Plain-English explanation,\n  Steps, Libraries used, and Definition of Done sub-blocks should be visually consistent and\n  easy to scan across all phases.\n- Highlight the two phases marked as core novelty (Phase 5 and Phase 10) with a distinct\n  accent treatment so a reader flipping through immediately sees where the contribution is.\n\nPRINT BEHAVIOUR\n- Avoid orphan headings: use break-after: avoid on all headings.\n- Keep table header rows repeating across page breaks (display: table-header-group on thead).\n- Never split a callout box or a phase header across two pages.\n- Ensure the SVG diagrams scale to fit the page width and never overflow.\n\nACCESSIBILITY AND POLISH\n- Semantic HTML: proper heading hierarchy, real &lt;table&gt; markup with &lt;th scope&gt;, &lt;nav&gt; for\n  the table of contents.\n- Sufficient colour contrast for the accent colour on white.\n- Set a &lt;title&gt; tag matching the document title.\n\nDELIVERABLE\nReturn the complete HTML file, nothing else. After it, add a short note telling me the exact\nbrowser steps to export it to PDF at the intended quality, and confirm that you checked the\noutput contains no em dash characters.<\u002Fpre>\n<p><strong>If you would rather get a live web page than a PDF:<\u002Fstrong> use the same prompt but ask for it to be published as an Artifact, and add \"make it responsive, theme-aware for light and dark mode, and give wide tables their own horizontal scroll container so the page body never scrolls sideways.\"<\u002Fp>\n<div style=\"margin:30px 0 10px;padding-top:14px;border-top:1px solid #d7dbe5;text-align:center;font-size:9.8pt;color:#5c6478;font-style:italic\">End of plan. Keep this document in the repository root and update it as decisions change. It is a living document, and the diff history of this file is itself evidence of your engineering process.<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdoc-page>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;paperSize&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;a4&quot;,&quot;letter&quot;],&quot;default&quot;:&quot;a4&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Print&quot;},&quot;pageMargin&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;15mm&quot;,&quot;20mm&quot;,&quot;25mm&quot;],&quot;default&quot;:&quot;20mm&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Print&quot;},&quot;showPlainEnglish&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Content&quot;}}\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      paperSize: this.props.paperSize ?? 'a4',\n      pageMargin: this.props.pageMargin ?? '20mm',\n      showPlainEnglish: this.props.showPlainEnglish ?? true\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
