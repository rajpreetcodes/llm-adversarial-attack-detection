document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

eline;font-family:'Segoe UI',Helvetica,sans-serif;font-size:8pt;color:#5c6478;border-top:1px solid #d7dbe5;padding-top:5px\">\n<span>DGAD: Disagreement-Gated Adaptive Detection<\u002Fspan>\n<span>Page <span style-after=\"content:counter(page)\"><\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n\n<div style=\"break-after:page;text-align:center;padding:96px 0 0\">\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:8.6pt;letter-spacing:.22em;text-transform:uppercase;color:#5c6478\">Technical Implementation Specification<\u002Fdiv>\n<div style=\"width:56px;height:3px;background:#2b3a67;margin:26px auto 34px\"><\u002Fdiv>\n<h1 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:30pt;line-height:1.15;font-weight:700;color:#1f2a4d;margin:0 0 14px;letter-spacing:-0.01em\">DGAD<\u002Fh1>\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:15pt;font-weight:600;color:#2b3a67;line-height:1.3;margin:0 0 22px\">Disagreement-Gated Adaptive Detection<\u002Fdiv>\n<div style=\"font-size:12pt;color:#3a4054;line-height:1.5;max-width:430px;margin:0 auto\">Adversarial Attack Detection for Large Language Models<\u002Fdiv>\n<div style=\"font-size:11pt;color:#5c6478;margin:8px 0 0\">Complete Implementation Plan, Start to Finish<\u002Fdiv>\n\n<div style=\"width:150px;height:1px;background:#d7dbe5;margin:52px auto\"><\u002Fdiv>\n\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt;line-height:1.7;color:#3a4054;max-width:470px;margin:0 auto\">\n<div style=\"font-weight:700;color:#1f2a4d\">SVKM's NMIMS<\u002Fdiv>\n<div>Mukesh Patel School of Technology Management &amp; Engineering<\u002Fdiv>\n<div>Mumbai Campus, Department of Information Technology<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"margin:46px auto 0;max-width:430px;text-align:left;border:1px solid #dfe3ec;border-top:3px solid #2b3a67;padding:20px 24px;font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.4pt;line-height:1.65;break-inside:avoid\">\n<div style=\"font-size:7.8pt;letter-spacing:.14em;text-transform:uppercase;color:#2b3a67;font-weight:700;margin-bottom:8px\">Project Team<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr auto;gap:2px 16px;color:#22262f\">\n<span>Rajpreet Singh Khurana<\u002Fspan><span style=\"font-family:Consolas,monospace;color:#5c6478\">K033<\u002Fspan>\n<span>Dhruv Rathod<\u002Fspan><span style=\"font-family:Consolas,monospace;color:#5c6478\">K055<\u002Fspan>\n<span>Sumit Pandey<\u002Fspan><span style=\"font-family:Consolas,monospace;color:#5c6478\">K044<\u002Fspan>\n<\u002Fdiv>\n<div style=\"height:1px;background:#e6e9f0;margin:16px 0\"><\u002Fdiv>\n<div style=\"font-size:7.8pt;letter-spacing:.14em;text-transform:uppercase;color:#2b3a67;font-weight:700;margin-bottom:6px\">Mentor<\u002Fdiv>\n<div style=\"color:#22262f\">Dr. Ruchi Sharma<\u002Fdiv>\n<div style=\"height:1px;background:#e6e9f0;margin:16px 0\"><\u002Fdiv>\n<div style=\"display:flex;justify-content:space-between;color:#5c6478;font-size:8.8pt\">\n<span>Plan version 1.0<\u002Fspan><span>28 July 2026<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<nav aria-label=\"Table of contents\" style=\"break-after:page\">\n<h2 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:15pt;font-weight:700;color:#1f2a4d;margin:0 0 4px;padding-bottom:7px;border-bottom:2px solid #2b3a67;letter-spacing:.01em\">Contents<\u002Fh2>\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.8pt;letter-spacing:.13em;text-transform:uppercase;color:#5c6478;margin:18px 0 4px\">Plan<\u002Fdiv>\n<a href=\"#p0\" style=\"display:flex;align-items:baseline;gap:8px;color:#16181d;border:none;padding:4px 0;font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt\"><span style=\"font-family:Consolas,monospace;color:#2b3a67;min-width:30px\">0<\u002Fspan><span>How To Read This Document<\u002Fspan><span style=\"flex:1;border-bottom:1px dotted #a8b0c6;transform:translateY(-3px)\"><\u002Fspan><\u002Fa>\n<a href=\"#p1\" style=\"display:flex;align-items:baseline;gap:8px;color:#16181d;border:none;padding:4px 0;font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt\"><span style=\"font-family:Consolas,monospace;color:#2b3a67;min-width:30px\">1<\u002Fspan><span>What We Are Building, In One Page<\u002Fspan><span style=\"flex:1;border-bottom:1px dotted #a8b0c6;transform:translateY(-3px)\"><\u002Fspan><\u002Fa>\n<a href=\"#p2\" style=\"display:flex;align-items:baseline;gap:8px;color:#16181d;border:none;padding:4px 0;font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt\"><span style=\"font-family:Consolas,monospace;color:#2b3a67;min-width:30px\">2<\u002Fspan><span>System Architecture<\u002Fspan><span style=\"flex:1;border-bottom:1px dotted #a8b0c6;transform:translateY(-3px)\"><\u002Fspan><\u002Fa>\n<a href=\"#p3\" style=\"display:flex;align-items:baseline;gap:8px;color:#16181d;border:none;padding:4px 0;font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt\"><span style=\"font-family:Consolas,monospace;color:#2b3a67;min-width:30px\">3<\u002Fspan><span>Team Split and Ownership<\u002Fspan><span style=\"flex:1;border-bottom:1px dotted #a8b0c6;transform:translateY(-3px)\"><\u002Fspan><\u002Fa>\n<a href=\"#p4\" style=\"display:flex;align-items:baseline;gap:8px;color:#16181d;border:none;padding:4px 0;font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt\"><span style=\"font-family:Consolas,monospace;color:#2b3a67;min-width:30px\">4<\u002Fspan><span>Repository Structure<\u002Fspan><span style=\"flex:1;border-bottom:1px dotted #a8b0c6;transform:translateY(-3px)\"><\u002Fspan><\u002Fa>\n<a href=\"#p5\" style=\"display:flex;align-items:baseline;gap:8px;color:#16181d;border:none;padding:4px 0;font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt\"><span style=\"font-family:Consolas,monospace;color:#2b3a67;min-width:30px\">5<\u002Fspan><span>Environment and Complete Library List<\u002Fspan><span style=\"flex:1;border-bottom:1px dotted #a8b0c6;transform:translateY(-3px)\"><\u002Fspan><\u002Fa>\n<a href=\"#p6\" style=\"display:flex;align-items:baseline;gap:8px;color:#16181d;border:none;padding:4px 0;font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt\"><span style=\"font-family:Consolas,monospace;color:#2b3a67;min-width:30px\">6<\u002Fspan><span>Benchmark Data: Every Source, With Direct Links<\u002Fspan><span style=\"flex:1;border-bottom:1px dotted #a8b0c6;transform:translateY(-3px)\"><\u002Fspan><\u002Fa>\n<a href=\"#p7\" style=\"display:flex;align-items:baseline;gap:8px;color:#16181d;border:none;padding:4px 0;font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt;font-weight:600\"><span style=\"font-family:Consolas,monospace;color:#2b3a67;min-width:30px\">7<\u002Fspan><span>The Implementation Phases<\u002Fspan><span style=\"flex:1;border-bottom:1px dotted #a8b0c6;transform:translateY(-3px)\"><\u002Fspan><\u002Fa>\n<div style=\"padding-left:38px;font-family:'Segoe UI',Helvetica,sans-serif;font-size:8.8pt;color:#4a5266;line-height:1.75;margin:2px 0 4px\">\n<a href=\"#ph0\" style=\"color:#4a5266;border:none\">Phase 0 Foundations<\u002Fa>, <a href=\"#ph1\" style=\"color:#4a5266;border:none\">1 Data layer<\u002Fa>, <a href=\"#ph2\" style=\"color:#4a5266;border:none\">2 Channel A<\u002Fa>, <a href=\"#ph3\" style=\"color:#4a5266;border:none\">3 Channel B<\u002Fa>, <a href=\"#ph4\" style=\"color:#4a5266;border:none\">4 Calibration<\u002Fa>, <a href=\"#ph5\" style=\"color:#6d5410;border:none;font-weight:700\">5 Disagreement gate<\u002Fa>, <a href=\"#ph6\" style=\"color:#4a5266;border:none\">6 Channel C<\u002Fa>, <a href=\"#ph7\" style=\"color:#4a5266;border:none\">7 Channel D<\u002Fa>, <a href=\"#ph8\" style=\"color:#4a5266;border:none\">8 Channel E<\u002Fa>, <a href=\"#ph9\" style=\"color:#4a5266;border:none\">9 Canary tripwire<\u002Fa>, <a href=\"#ph10\" style=\"color:#6d5410;border:none;font-weight:700\">10 Self-adversarial loop<\u002Fa>, <a href=\"#ph11\" style=\"color:#4a5266;border:none\">11 API and proxy<\u002Fa>, <a href=\"#ph12\" style=\"color:#4a5266;border:none\">12 Dashboard<\u002Fa>, <a href=\"#ph13\" style=\"color:#4a5266;border:none\">13 Evaluation and ablation<\u002Fa>, <a href=\"#ph14\" style=\"color:#4a5266;border:none\">14 Red-teaming<\u002Fa>, <a href=\"#ph15\" style=\"color:#4a5266;border:none\">15 Report and viva<\u002Fa>\n<\u002Fdiv>\n<a href=\"#p8\" style=\"display:flex;align-items:baseline;gap:8px;color:#16181d;border:none;padding:4px 0;font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt;font-weight:600\"><span style=\"font-family:Consolas,monospace;color:#2b3a67;min-width:30px\">8<\u002Fspan><span>CAMS: The DevOps Procedure<\u002Fspan><span style=\"flex:1;border-bottom:1px dotted #a8b0c6;transform:translateY(-3px)\"><\u002Fspan><\u002Fa>\n<a href=\"#p9\" style=\"display:flex;align-items:baseline;gap:8px;color:#16181d;border:none;padding:4px 0;font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt\"><span style=\"font-family:Consolas,monospace;color:#2b3a67;min-width:30px\">9<\u002Fspan><span>Viva Preparation: Questions You Will Be Asked<\u002Fspan><span style=\"flex:1;border-bottom:1px dotted #a8b0c6;transform:translateY(-3px)\"><\u002Fspan><\u002Fa>\n<a href=\"#p10\" style=\"display:flex;align-items:baseline;gap:8px;color:#16181d;border:none;padding:4px 0;font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt\"><span style=\"font-family:Consolas,monospace;color:#2b3a67;min-width:30px\">10<\u002Fspan><span>Risk Register<\u002Fspan><span style=\"flex:1;border-bottom:1px dotted #a8b0c6;transform:translateY(-3px)\"><\u002Fspan><\u002Fa>\n<a href=\"#p11\" style=\"display:flex;align-items:baseline;gap:8px;color:#16181d;border:none;padding:4px 0;font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt\"><span style=\"font-family:Consolas,monospace;color:#2b3a67;min-width:30px\">11<\u002Fspan><span>Timeline<\u002Fspan><span style=\"flex:1;border-bottom:1px dotted #a8b0c6;transform:translateY(-3px)\"><\u002Fspan><\u002Fa>\n<a href=\"#p12\" style=\"display:flex;align-items:baseline;gap:8px;color:#16181d;border:none;padding:4px 0;font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt\"><span style=\"font-family:Consolas,monospace;color:#2b3a67;min-width:30px\">12<\u002Fspan><span>Two Decisions To Take To Dr. Sharma Before Coding<\u002Fspan><span style=\"flex:1;border-bottom:1px dotted #a8b0c6;transform:translateY(-3px)\"><\u002Fspan><\u002Fa>\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.8pt;letter-spacing:.13em;text-transform:uppercase;color:#5c6478;margin:20px 0 4px\">Appendices<\u002Fdiv>\n<a href=\"#appa\" style=\"display:flex;align-items:baseline;gap:8px;color:#16181d;border:none;padding:4px 0;font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt\"><span style=\"font-family:Consolas,monospace;color:#2b3a67;min-width:30px\">A<\u002Fspan><span>Every Link In One Place<\u002Fspan><span style=\"flex:1;border-bottom:1px dotted #a8b0c6;transform:translateY(-3px)\"><\u002Fspan><\u002Fa>\n<a href=\"#appb\" style=\"display:flex;align-items:baseline;gap:8px;color:#16181d;border:none;padding:4px 0;font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt\"><span style=\"font-family:Consolas,monospace;color:#2b3a67;min-width:30px\">B<\u002Fspan><span>Consolidated Library List<\u002Fspan><span style=\"flex:1;border-bottom:1px dotted #a8b0c6;transform:translateY(-3px)\"><\u002Fspan><\u002Fa>\n<a href=\"#appc\" style=\"display:flex;align-items:baseline;gap:8px;color:#16181d;border:none;padding:4px 0;font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt\"><span style=\"font-family:Consolas,monospace;color:#2b3a67;min-width:30px\">C<\u002Fspan><span>Prompt For Converting This Document Into A Presentable PDF<\u002Fspan><span style=\"flex:1;border-bottom:1px dotted #a8b0c6;transform:translateY(-3px)\"><\u002Fspan><\u002Fa>\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.8pt;letter-spacing:.13em;text-transform:uppercase;color:#5c6478;margin:20px 0 4px\">Figures<\u002Fdiv>\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:9pt;color:#4a5266;line-height:1.8\">\n<div>Figure 1. Request flow through the detection layer<\u002Fdiv>\n<div>Figure 2. The indirect injection path (canary tripwire)<\u002Fdiv>\n<div>Figure 3. The CI/CD pipeline<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fnav>\n\n<section id=\"p0\">\n<h2 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:16pt;font-weight:700;color:#1f2a4d;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid #2b3a67;line-height:1.25\"><span style=\"font-family:Consolas,monospace;font-size:13pt;color:#2b3a67;margin-right:12px\">0<\u002Fspan>How To Read This Document<\u002Fh2>\n<p>This document is written so that any one of the three of you can open it on any day and know exactly what to do next, without asking the other two. Every phase has the same five headings:<\u002Fp>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"width:26%\">Heading<\u002Fsc-raw-th><sc-raw-th scope=\"col\">What it means<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td><strong>Goal<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The one thing this phase must achieve.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Plain-English explanation<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The idea explained with no jargon, so you can also use this wording in the viva.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Steps<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The actual ordered work.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Libraries used<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Exactly which packages, so nobody installs something random.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Definition of Done (DoD)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The test that proves the phase is finished. If you cannot show this, the phase is not done.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<div style=\"border:1px solid #dfe3ec;border-left:3px solid #2b3a67;background:#f6f7fb;padding:11px 15px;margin:16px 0;break-inside:avoid\">\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#2b3a67;font-weight:700;margin-bottom:5px\">Important<\u002Fdiv>\n<p style=\"margin:0\">Important rule for this team: this plan deliberately contains <strong>specifications, algorithms, formulas, function signatures, and library names, but not finished source code.<\u002Fstrong> You are writing the code yourselves. That is not a limitation, it is the point: you must each be able to defend every line at the viva. Where a formula or a call pattern is shown, it is there to teach the idea, not to be pasted in blindly.<\u002Fp>\n<\u002Fdiv>\n<h3 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:11.5pt;font-weight:700;color:#2b3a67;margin:22px 0 6px\">0.1 Glossary in Plain Words<\u002Fh3>\n<p>Read this once. Everything else in the document assumes you know these.<\u002Fp>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"width:24%\">Term<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Plain-English meaning<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td><strong>LLM<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A large language model, such as GPT-4 or Llama. A program that predicts text.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Prompt<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>The text a user sends to an LLM.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Jailbreak<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A prompt written to trick an LLM into doing something its safety rules forbid.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Prompt injection<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Hidden instructions smuggled inside data (a web page, an email, a PDF) that the LLM reads and mistakenly obeys.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Adversarial suffix<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A block of strange-looking characters added to the end of a prompt, found by an algorithm, that breaks the model's safety. GCG-style attacks make these.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Perplexity<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A number saying \"how surprising is this text to a language model\". Normal English gets a low number. Random-looking garbage gets a high number.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Embedding<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A list of numbers (a vector) that represents the <em>meaning<\u002Fem> of a sentence. Two sentences with similar meaning get similar vectors.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Classifier<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A small model that looks at input and outputs a label, here \"attack\" or \"benign\".<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Guard model<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A ready-made classifier published by a company (Meta, ProtectAI) whose only job is spotting attacks.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>LLM-as-a-judge<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Asking a second LLM, in plain English, \"is this prompt an attack? explain why\". Accurate but slow and expensive.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Benign<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Harmless, normal, not an attack.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>False positive (FP)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>We flagged a normal prompt as an attack. Annoys real users.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>False negative (FN)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>We missed a real attack. Dangerous.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Over-defense<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A detector that panics at innocent prompts just because they contain scary words like \"ignore\" or \"bomb\".<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Calibration<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Fixing a detector's score so that \"0.8\" genuinely means \"80% likely an attack\" instead of being an arbitrary number.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Black-box<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>We can only send text in and read text out. We cannot see inside the model. This is our situation with commercial APIs.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>White-box<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>We can see the model's internal weights, gradients, and attention. Most recent research papers need this. We do not have it, and that is our niche.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Latency<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>How long our detector adds to each request, measured in milliseconds.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>ROC-AUC<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>A single number from 0.5 to 1.0 measuring how well a detector separates attacks from benign across all thresholds. Higher is better. 0.5 is a coin flip.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Ablation<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Turning off one part of your system and re-measuring, to prove that part actually mattered.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>CAMS<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Culture, Automation, Measurement, Sharing. The four pillars of DevOps. Explained fully in Part 8.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fsection>\n\n<section id=\"p1\">\n<h2 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:16pt;font-weight:700;color:#1f2a4d;margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid #2b3a67;line-height:1.25\"><span style=\"font-family:Consolas,monospace;font-size:13pt;color:#2b3a67;margin-right:12px\">1<\u002Fspan>What We Are Building, In One Page<\u002Fh2>\n<p>We are building a <strong>security layer that sits in front of any LLM<\u002Fstrong> and inspects every prompt before it reaches the model. If the prompt looks like an attack, we block it, log it, and show it on a dashboard.<\u002Fp>\n<p>That much is standard. Here is what makes ours different.<\u002Fp>\n<p>Every existing system runs several detectors and then <strong>averages their scores<\u002Fstrong>. If detector A says 0.2 and detector B says 0.9, they average to 0.55 and the system shrugs.<\u002Fp>\n<p><strong>We treat that disagreement as the most valuable event in the system.<\u002Fstrong><\u002Fp>\n<p>Think of it like two security guards at a gate. One guard checks IDs (does this text look statistically weird?). The other guard reads body language (does this text <em>mean<\u002Fem> something harmful?). When both guards agree, you trust them and move on instantly. <strong>When they disagree, that is exactly the person you pull aside for a proper search.<\u002Fstrong> Averaging their opinions into \"55% suspicious\" throws away the only interesting information you had.<\u002Fp>\n<p>So our system:<\u002Fp>\n<ol>\n<li>Runs two <strong>cheap<\u002Fstrong> detectors on every prompt.<\u002Fli>\n<li>If they agree, decide immediately. Fast, free.<\u002Fli>\n<li>If they <strong>disagree<\u002Fstrong>, escalate only that prompt to two <strong>expensive<\u002Fstrong> detectors.<\u002Fli>\n<li>Separately, a small attack generator constantly tries to find prompts that fool <strong>both<\u002Fstrong> cheap detectors in the <em>same<\u002Fem> direction, because those are the prompts that would sneak past our gate without triggering an escalation. Whatever it finds becomes new training data. The system hardens itself over time.<\u002Fli>\n<\u002Fol>\n<h3 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:11.5pt;font-weight:700;color:#2b3a67;margin:22px 0 6px\">1.1 The Novelty Statement (memorise this for the viva)<\u002Fh3>\n<blockquote style=\"margin:14px 0;padding:13px 17px;background:#f4f6fa;border-left:3px solid #2b3a67;font-size:10.3pt;line-height:1.6;break-inside:avoid\">Our contribution is not a new adversarial-input detector but a new mechanism for combining and adapting existing detectors. Prior systems either use a single detection signal or fuse several by averaging their scores. We propose Disagreement-Gated Adaptive Detection: the disagreement between cheap statistical and semantic detectors is used as the primary signal to route only contested inputs to expensive verification (a black-box behavioural-consistency probe and an LLM judge), and the fused detector is hardened by a self-adversarial calibration loop that specifically searches for inputs producing false agreement across channels. The system is fully black-box and model-agnostic. We evaluate against single detectors and naive fusion on detection accuracy, latency, and robustness to adaptive evasion, so the novelty is measurable rather than architectural.<\u002Fblockquote>\n<h3 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:11.5pt;font-weight:700;color:#2b3a67;margin:22px 0 6px\">1.2 Why This Survives The \"You Just Combined Existing Work\" Objection<\u002Fh3>\n<p>This is the exact criticism that was raised on the first synopsis. Keep this table ready.<\u002Fp>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"width:24%\">Existing work<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"width:33%\">What it does<\u002Fsc-raw-th><sc-raw-th scope=\"col\">How DGAD is different<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td>Naive ensembles / score fusion<\u002Fsc-raw-td><sc-raw-td>Average or vote across detectors.<\u002Fsc-raw-td><sc-raw-td>We use <strong>disagreement as a control signal<\u002Fstrong> to route traffic, not as a number to average. This also makes us cheaper, which is measurable.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>DataSentinel (arXiv 2504.11358)<\u002Fsc-raw-td><sc-raw-td>Fine-tunes one \"canary\" LLM using minimax game theory.<\u002Fsc-raw-td><sc-raw-td>Our adversarial loop optimises against <strong>cross-channel false agreement<\u002Fstrong> in a multi-detector black-box system. Different objective, different level (system, not model).<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>The Consistency Confound (OpenReview)<\u002Fsc-raw-td><sc-raw-td>Shows behavioural consistency <strong>fails alone<\u002Fstrong> as a black-box detector (85 to 98 percent false negatives).<\u002Fsc-raw-td><sc-raw-td>We never use it alone. It is one tie-breaker applied only to the small contested subset. Citing this paper <em>ourselves<\u002Fem> proves we did the homework.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>ROD / Representation Offset Detection<\u002Fsc-raw-td><sc-raw-td>Measures gap between a prompt and its intent, <strong>in hidden states<\u002Fstrong>. Needs white-box access.<\u002Fsc-raw-td><sc-raw-td>We build a <strong>black-box approximation<\u002Fstrong> using paraphrase plus sentence embeddings, and we cite ROD as the inspiration. We claim only the black-box adaptation.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Attention Tracker, PIShield, PISanitizer<\u002Fsc-raw-td><sc-raw-td>Read attention weights or hidden states. White-box.<\u002Fsc-raw-td><sc-raw-td>Out of reach for commercial APIs. Our whole system is black-box, which is our defensible niche.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>Perplexity filter (Alon and Kamfonas, Jain et al.)<\u002Fsc-raw-td><sc-raw-td>One statistical signal.<\u002Fsc-raw-td><sc-raw-td>Becomes just <strong>Channel A<\u002Fstrong> inside our system.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td>InjecGuard, Prompt Guard, Llama Guard<\u002Fsc-raw-td><sc-raw-td>Fine-tuned guard classifiers.<\u002Fsc-raw-td><sc-raw-td>Become <strong>Channel B baselines and comparison points<\u002Fstrong>, not the contribution.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<h3 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:11.5pt;font-weight:700;color:#2b3a67;margin:22px 0 6px\">1.3 The Claim We Must Prove (this is your thesis result)<\u002Fh3>\n<blockquote style=\"margin:14px 0;padding:13px 17px;background:#f4f6fa;border-left:3px solid #2b3a67;font-size:10.3pt;line-height:1.6;break-inside:avoid\">DGAD achieves higher ROC-AUC <strong>and<\u002Fstrong> lower average latency <strong>and<\u002Fstrong> higher robustness under adaptive evasion than (a) each individual detector alone, and (b) naive score-averaging fusion of the same detectors, on a combined benchmark of optimisation-based jailbreaks, in-the-wild jailbreaks, prompt injections, and benign prompts.<\u002Fblockquote>\n<p>If this turns out false, <strong>you still have a project<\u002Fstrong>: a rigorous negative result with a full ablation table is publishable and defensible. Do not fake numbers to make the claim true. Report what you measure.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"p2\">\n<h2 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:16pt;font-weight:700;color:#1f2a4d;margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid #2b3a67;line-height:1.25\"><span style=\"font-family:Consolas,monospace;font-size:13pt;color:#2b3a67;margin-right:12px\">2<\u002Fspan>System Architecture<\u002Fh2>\n<h3 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:11.5pt;font-weight:700;color:#2b3a67;margin:18px 0 6px\">2.1 Request Flow<\u002Fh3>\n<figure style=\"break-inside:avoid\">\n<svg sc-camel-view-box=\"0 0 640 692\" role=\"img\" aria-label=\"Figure 1: request flow through the DGAD detection layer\" style=\"width:100%\">\n<defs>\n<marker id=\"f1a\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"9\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"#5c6478\"><\u002Fpath><\u002Fmarker>\n<marker id=\"f1b\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"9\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"#a58a3f\"><\u002Fpath><\u002Fmarker>\n<\u002Fdefs>\n<g fill=\"none\" stroke=\"#5c6478\" stroke-width=\"1.2\" marker-end=\"url(#f1a)\">\n<path d=\"M320,42 V54\"><\u002Fpath>\n<path d=\"M320,90 V98\"><\u002Fpath>\n<path d=\"M105,98 V116\" stroke-dasharray=\"0\"><\u002Fpath>\n<path d=\"M320,98 V116\"><\u002Fpath>\n<path d=\"M535,98 V116\"><\u002Fpath>\n<path d=\"M105,176 V186 H180\"><\u002Fpath>\n<path d=\"M320,176 V188\"><\u002Fpath>\n<path d=\"M535,176 V186 H460\"><\u002Fpath>\n<path d=\"M320,238 V252\"><\u002Fpath>\n<path d=\"M205,290 H90 V350\"><\u002Fpath>\n<path d=\"M320,326 V350\"><\u002Fpath>\n<path d=\"M435,290 H550 V350\"><\u002Fpath>\n<path d=\"M320,470 V484\"><\u002Fpath>\n<path d=\"M175,503 H70 V388\"><\u002Fpath>\n<path d=\"M465,503 H570 V388\"><\u002Fpath>\n<path d=\"M45,388 V560 H233\"><\u002Fpath>\n<path d=\"M595,388 V560 H407\"><\u002Fpath>\n<path d=\"M280,589 V607 H130 V623\"><\u002Fpath>\n<path d=\"M360,589 V607 H495 V623\"><\u002Fpath>\n<\u002Fg>\n<g fill=\"none\" stroke=\"#5c6478\" stroke-width=\"1.2\">\n<path d=\"M105,98 H535\"><\u002Fpath>\n<path d=\"M180,186 H460\"><\u002Fpath>\n<\u002Fg>\n<g fill=\"none\" stroke=\"#a58a3f\" stroke-width=\"1.2\" stroke-dasharray=\"4 3\" marker-end=\"url(#f1b)\">\n<path d=\"M600,647 H632 V214 H462\"><\u002Fpath>\n<path d=\"M632,150 V110 H380 V116\"><\u002Fpath>\n<\u002Fg>\n<g font-family=\"'Segoe UI',Helvetica,sans-serif\" fill=\"#1f2a4d\">\n<rect x=\"190\" y=\"8\" width=\"260\" height=\"34\" rx=\"3\" fill=\"#fff\" stroke=\"#c3cadb\"><\u002Frect><text x=\"320\" y=\"30\" font-size=\"12\" text-anchor=\"middle\">User prompt or untrusted data<\u002Ftext>\n<rect x=\"195\" y=\"54\" width=\"250\" height=\"36\" rx=\"3\" fill=\"#fff\" stroke=\"#c3cadb\"><\u002Frect><text x=\"320\" y=\"77\" font-size=\"12\" text-anchor=\"middle\">Normalise and de-obfuscate<\u002Ftext>\n<rect x=\"10\" y=\"116\" width=\"190\" height=\"60\" rx=\"3\" fill=\"#f4f6fa\" stroke=\"#c3cadb\"><\u002Frect><text x=\"105\" y=\"135\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\">Channel A: Statistical<\u002Ftext><text x=\"105\" y=\"151\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5266\">windowed perplexity<\u002Ftext><text x=\"105\" y=\"165\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5266\">+ token anomaly<\u002Ftext>\n<rect x=\"225\" y=\"116\" width=\"190\" height=\"60\" rx=\"3\" fill=\"#f4f6fa\" stroke=\"#c3cadb\"><\u002Frect><text x=\"320\" y=\"135\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\">Channel B: Semantic<\u002Ftext><text x=\"320\" y=\"151\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5266\">embedding<\u002Ftext><text x=\"320\" y=\"165\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5266\">classifier<\u002Ftext>\n<rect x=\"440\" y=\"116\" width=\"190\" height=\"60\" rx=\"3\" fill=\"#f4f6fa\" stroke=\"#c3cadb\"><\u002Frect><text x=\"535\" y=\"135\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\">Channel E: Black-box<\u002Ftext><text x=\"535\" y=\"151\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5266\">representation<\u002Ftext><text x=\"535\" y=\"165\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5266\">offset<\u002Ftext>\n<rect x=\"180\" y=\"188\" width=\"280\" height=\"50\" rx=\"3\" fill=\"#fff\" stroke=\"#c3cadb\"><\u002Frect><text x=\"320\" y=\"209\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\">Calibration layer<\u002Ftext><text x=\"320\" y=\"226\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5266\">Platt / isotonic<\u002Ftext>\n<path d=\"M320,252 L435,290 L320,328 L205,290 Z\" fill=\"#2b3a67\"><\u002Fpath><text x=\"320\" y=\"294\" font-size=\"12\" text-anchor=\"middle\" fill=\"#fff\" font-weight=\"700\">Disagreement gate<\u002Ftext>\n<text x=\"198\" y=\"282\" font-size=\"9.5\" text-anchor=\"end\" fill=\"#4a5266\">all agree BENIGN<\u002Ftext>\n<text x=\"442\" y=\"282\" font-size=\"9.5\" fill=\"#4a5266\">all agree ATTACK<\u002Ftext>\n<text x=\"327\" y=\"344\" font-size=\"9.5\" fill=\"#4a5266\">CONTESTED<\u002Ftext>\n<rect x=\"15\" y=\"350\" width=\"150\" height=\"36\" rx=\"3\" fill=\"#eef3ee\" stroke=\"#7f9a84\"><\u002Frect><text x=\"90\" y=\"373\" font-size=\"12\" text-anchor=\"middle\">PASS to LLM<\u002Ftext>\n<rect x=\"475\" y=\"350\" width=\"150\" height=\"36\" rx=\"3\" fill=\"#faeef0\" stroke=\"#ab767f\"><\u002Frect><text x=\"550\" y=\"373\" font-size=\"12\" text-anchor=\"middle\">BLOCK and log<\u002Ftext>\n<rect x=\"150\" y=\"350\" width=\"340\" height=\"120\" rx=\"4\" fill=\"#fdfbf4\" stroke=\"#a58a3f\" stroke-dasharray=\"4 3\"><\u002Frect>\n<text x=\"162\" y=\"368\" font-size=\"8.5\" fill=\"#6d5410\" font-weight=\"700\" letter-spacing=\"1.2\">ESCALATION TIER<\u002Ftext>\n<rect x=\"162\" y=\"392\" width=\"155\" height=\"70\" rx=\"3\" fill=\"#fff\" stroke=\"#c3cadb\"><\u002Frect><text x=\"239\" y=\"410\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"700\">Channel C<\u002Ftext><text x=\"239\" y=\"425\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#4a5266\">Behavioural probe<\u002Ftext><text x=\"239\" y=\"439\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#4a5266\">K perturbations on<\u002Ftext><text x=\"239\" y=\"453\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#4a5266\">proxy model<\u002Ftext>\n<rect x=\"325\" y=\"392\" width=\"153\" height=\"70\" rx=\"3\" fill=\"#fff\" stroke=\"#c3cadb\"><\u002Frect><text x=\"401\" y=\"410\" font-size=\"11\" text-anchor=\"middle\" font-weight=\"700\">Channel D<\u002Ftext><text x=\"401\" y=\"425\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#4a5266\">LLM-as-a-judge<\u002Ftext><text x=\"401\" y=\"439\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#4a5266\">with natural-language<\u002Ftext><text x=\"401\" y=\"453\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#4a5266\">rationale<\u002Ftext>\n<rect x=\"175\" y=\"484\" width=\"290\" height=\"36\" rx=\"3\" fill=\"#fff\" stroke=\"#2b3a67\" stroke-width=\"1.4\"><\u002Frect><text x=\"320\" y=\"507\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\">Final decision + rationale<\u002Ftext>\n<rect x=\"233\" y=\"543\" width=\"174\" height=\"46\" rx=\"6\" fill=\"#f2f3f7\" stroke=\"#c3cadb\"><\u002Frect><text x=\"320\" y=\"565\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\">Postgres<\u002Ftext><text x=\"320\" y=\"580\" font-size=\"10\" text-anchor=\"middle\" fill=\"#4a5266\">audit log<\u002Ftext>\n<rect x=\"40\" y=\"623\" width=\"180\" height=\"36\" rx=\"3\" fill=\"#fff\" stroke=\"#c3cadb\"><\u002Frect><text x=\"130\" y=\"646\" font-size=\"12\" text-anchor=\"middle\">React dashboard<\u002Ftext>\n<rect x=\"390\" y=\"623\" width=\"210\" height=\"46\" rx=\"3\" fill=\"#fdfbf4\" stroke=\"#a58a3f\"><\u002Frect><text x=\"495\" y=\"641\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\">Self-adversarial<\u002Ftext><text x=\"495\" y=\"657\" font-size=\"10\" text-anchor=\"middle\" fill=\"#6d5410\">calibration loop<\u002Ftext>\n<text x=\"470\" y=\"209\" font-size=\"9\" fill=\"#6d5410\">new thresholds<\u002Ftext>\n<text x=\"388\" y=\"105\" font-size=\"9\" fill=\"#6d5410\">new hard negatives<\u002Ftext>\n<\u002Fg>\n<\u002Fsvg>\n<figcaption><strong style=\"color:#2b3a67\">Figure 1.<\u002Fstrong> Request flow. Three cheap channels score every prompt; the calibration layer puts them on one probability scale; the disagreement gate routes only contested prompts into the expensive escalation tier. Every decision is logged, and the audit log feeds both the dashboard and the self-adversarial loop, which returns hard negatives to Channel B and new thresholds to the calibration layer.<\u002Ffigcaption>\n<\u002Ffigure>\n\n<h3 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:11.5pt;font-weight:700;color:#2b3a67;margin:22px 0 6px\">2.2 The Indirect Injection Path (Canary Tripwire)<\u002Fh3>\n<figure style=\"break-inside:avoid\">\n<svg sc-camel-view-box=\"0 0 640 262\" role=\"img\" aria-label=\"Figure 2: the canary tripwire flow for indirect prompt injection\" style=\"width:100%\">\n<defs><marker id=\"f2a\" sc-camel-view-box=\"0 0 10 10\" sc-camel-ref-x=\"9\" sc-camel-ref-y=\"5\" sc-camel-marker-width=\"7\" sc-camel-marker-height=\"7\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" fill=\"#5c6478\"><\u002Fpath><\u002Fmarker><\u002Fdefs>\n<g fill=\"none\" stroke=\"#5c6478\" stroke-width=\"1.2\" marker-end=\"url(#f2a)\">\n<path d=\"M187,40 H211\"><\u002Fpath>\n<path d=\"M402,40 H426\"><\u002Fpath>\n<path d=\"M505,58 V90\"><\u002Fpath>\n<path d=\"M440,109 H412 V130 H384\"><\u002Fpath>\n<path d=\"M130,192 V210\"><\u002Fpath>\n<path d=\"M405,192 V210\"><\u002Fpath>\n<\u002Fg>\n<path d=\"M250,174 V192 H130 M250,192 H405\" fill=\"none\" stroke=\"#5c6478\" stroke-width=\"1.2\"><\u002Fpath>\n<g font-family=\"'Segoe UI',Helvetica,sans-serif\" fill=\"#1f2a4d\">\n<rect x=\"10\" y=\"12\" width=\"177\" height=\"56\" rx=\"3\" fill=\"#fff\" stroke=\"#c3cadb\"><\u002Frect><text x=\"98\" y=\"31\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\">Untrusted document<\u002Ftext><text x=\"98\" y=\"46\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#4a5266\">web page, email,<\u002Ftext><text x=\"98\" y=\"59\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#4a5266\">tool output<\u002Ftext>\n<rect x=\"211\" y=\"12\" width=\"191\" height=\"56\" rx=\"3\" fill=\"#f4f6fa\" stroke=\"#c3cadb\"><\u002Frect><text x=\"306\" y=\"34\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\">Wrap with randomised<\u002Ftext><text x=\"306\" y=\"50\" font-size=\"11.5\" text-anchor=\"middle\" font-weight=\"700\">canary directive<\u002Ftext>\n<rect x=\"426\" y=\"22\" width=\"158\" height=\"36\" rx=\"3\" fill=\"#fff\" stroke=\"#c3cadb\"><\u002Frect><text x=\"505\" y=\"45\" font-size=\"12\" text-anchor=\"middle\">Target LLM<\u002Ftext>\n<rect x=\"440\" y=\"90\" width=\"130\" height=\"36\" rx=\"3\" fill=\"#fff\" stroke=\"#c3cadb\"><\u002Frect><text x=\"505\" y=\"113\" font-size=\"12\" text-anchor=\"middle\">Response<\u002Ftext>\n<path d=\"M250,86 L380,130 L250,174 L120,130 Z\" fill=\"#2b3a67\"><\u002Fpath><text x=\"250\" y=\"126\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#fff\">Canary token present?<\u002Ftext><text x=\"250\" y=\"141\" font-size=\"9.5\" text-anchor=\"middle\" fill=\"#e6e9f2\">Embedded instruction obeyed?<\u002Ftext>\n<text x=\"124\" y=\"206\" font-size=\"9\" text-anchor=\"end\" fill=\"#4a5266\">canary intact<\u002Ftext>\n<text x=\"412\" y=\"206\" font-size=\"9\" fill=\"#4a5266\">canary dropped or instruction obeyed<\u002Ftext>\n<rect x=\"60\" y=\"210\" width=\"140\" height=\"36\" rx=\"3\" fill=\"#eef3ee\" stroke=\"#7f9a84\"><\u002Frect><text x=\"130\" y=\"233\" font-size=\"12\" text-anchor=\"middle\">Clean<\u002Ftext>\n<rect x=\"300\" y=\"210\" width=\"210\" height=\"36\" rx=\"3\" fill=\"#faeef0\" stroke=\"#ab767f\"><\u002Frect><text x=\"405\" y=\"233\" font-size=\"12\" text-anchor=\"middle\" font-weight=\"700\">INJECTION DETECTED<\u002Ftext>\n<\u002Fg>\n<\u002Fsvg>\n<figcaption><strong style=\"color:#2b3a67\">Figure 2.<\u002Fstrong> The canary tripwire. Untrusted content is wrapped with a freshly randomised directive before it reaches the model. A reply that has lost the canary, or that obeys an instruction from inside the data boundary, is evidence of indirect injection.<\u002Ffigcaption>\n<\u002Ffigure>\n\n<h3 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:11.5pt;font-weight:700;color:#2b3a67;margin:22px 0 6px\">2.3 Why Each Channel Exists<\u002Fh3>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"width:19%\">Channel<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"width:29%\">Catches<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"width:29%\">Blind to<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Cost<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td><strong>A. Statistical<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>GCG-style gibberish suffixes, encoding tricks, character obfuscation<\u002Fsc-raw-td><sc-raw-td>Fluent, well-written jailbreaks<\u002Fsc-raw-td><sc-raw-td>Very low (one small model forward pass)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>B. Semantic classifier<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Role-play jailbreaks, \"ignore previous instructions\", DAN prompts<\u002Fsc-raw-td><sc-raw-td>Novel phrasings unseen in training; over-defends on innocent trigger words<\u002Fsc-raw-td><sc-raw-td>Low (one embedding + logistic regression)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>E. Representation offset<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Prompts whose surface meaning and true intent diverge (disguised requests)<\u002Fsc-raw-td><sc-raw-td>Direct, unhidden harmful requests<\u002Fsc-raw-td><sc-raw-td>Low to medium (one paraphrase call)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>C. Behavioural probe<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Brittle optimised attacks that collapse under small perturbation<\u002Fsc-raw-td><sc-raw-td>Well-aligned models make this weak alone. <strong>Only used on contested inputs.<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>High (K generations)<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>D. LLM judge<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Almost everything, with a human-readable reason<\u002Fsc-raw-td><sc-raw-td>Slow, costly, itself attackable<\u002Fsc-raw-td><sc-raw-td>Highest<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<p>Notice <strong>A and B have opposite blind spots.<\u002Fstrong> That is the entire foundation of the disagreement signal. When one fires and the other does not, you are almost certainly looking at either a clever attack or an unusual-but-innocent prompt. Both are worth a closer look.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"p3\">\n<h2 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:16pt;font-weight:700;color:#1f2a4d;margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid #2b3a67;line-height:1.25\"><span style=\"font-family:Consolas,monospace;font-size:13pt;color:#2b3a67;margin-right:12px\">3<\u002Fspan>Team Split and Ownership<\u002Fh2>\n<p>Three people, three vertical slices. Each person owns their slice end to end, including its tests and its section of the final report. Nobody is \"the one who does the frontend\" only.<\u002Fp>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"width:24%\">Owner<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Primary ownership<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"width:20%\">Secondary / reviewer for<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td><strong>Rajpreet Singh Khurana (K033)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Channels C, D, E (behavioural probe, LLM judge, representation offset), the self-adversarial calibration loop, security red-teaming of our own detector<\u002Fsc-raw-td><sc-raw-td>Data pipeline<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Dhruv Rathod (K055)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>Data layer, Channel A and B, calibration layer, disagreement gate, evaluation harness and ablation tables<\u002Fsc-raw-td><sc-raw-td>CI/CD<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><strong>Sumit Pandey (K044)<\u002Fstrong><\u002Fsc-raw-td><sc-raw-td>FastAPI proxy middleware, database and audit logging, React dashboard, Docker, CI/CD pipeline, deployment<\u002Fsc-raw-td><sc-raw-td>Metrics collection<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<div style=\"border:1px solid #dfe3ec;border-left:3px solid #2b3a67;background:#f6f7fb;padding:11px 15px;margin:16px 0;break-inside:avoid\">\n<div style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:7.6pt;letter-spacing:.13em;text-transform:uppercase;color:#2b3a67;font-weight:700;margin-bottom:5px\">Rule<\u002Fdiv>\n<p style=\"margin:0\">Nobody merges their own pull request. Every PR needs one approval from another team member. This is not bureaucracy, it is the \"Culture\" pillar of CAMS and it is what stops one person becoming the single point of failure two weeks before submission.<\u002Fp>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"p4\">\n<h2 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:16pt;font-weight:700;color:#1f2a4d;margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid #2b3a67;line-height:1.25\"><span style=\"font-family:Consolas,monospace;font-size:13pt;color:#2b3a67;margin-right:12px\">4<\u002Fspan>Repository Structure<\u002Fh2>\n<p>Use <strong>one repository, one Python package.<\u002Fstrong> Do not split into microservices; you are three people with a semester.<\u002Fp>\n<pre style=\"margin:14px 0;background:#f6f7f9;border-left:3px solid #2b3a67;padding:12px 15px;font-family:Consolas,'Liberation Mono',Menlo,monospace;font-size:8.1pt;line-height:1.5;color:#22262f;white-space:pre-wrap;overflow-wrap:break-word\">dgad/\n├── README.md\n├── final_plan.md                  &lt;- this document\n├── pyproject.toml                 &lt;- dependencies, tool config\n├── .pre-commit-config.yaml\n├── .env.example                   &lt;- names of secrets only, never values\n├── docker-compose.yml\n├── Dockerfile\n├── .github/\n│   └── workflows/\n│       ├── ci.yml                 &lt;- lint, type-check, unit tests\n│       ├── eval.yml               &lt;- nightly benchmark run\n│       └── security.yml           &lt;- dependency + secret scanning\n├── data/\n│   ├── raw/                       &lt;- downloaded datasets, gitignored\n│   ├── interim/                   &lt;- normalised, gitignored\n│   ├── processed/                 &lt;- final splits, gitignored\n│   └── README.md                  &lt;- documents every source + license\n├── src/dgad/\n│   ├── __init__.py\n│   ├── config.py                  &lt;- pydantic-settings, all thresholds live here\n│   ├── schemas.py                 &lt;- pydantic models for every payload\n│   ├── normalise.py               &lt;- unicode + de-obfuscation preprocessing\n│   ├── channels/\n│   │   ├── base.py                &lt;- abstract Channel: score(text) -&gt; ChannelResult\n│   │   ├── statistical.py         &lt;- Channel A\n│   │   ├── semantic.py            &lt;- Channel B\n│   │   ├── behavioural.py         &lt;- Channel C\n│   │   ├── judge.py               &lt;- Channel D\n│   │   └── offset.py              &lt;- Channel E\n│   ├── calibration.py             &lt;- Platt / isotonic wrappers, reliability curves\n│   ├── gate.py                    &lt;- THE DISAGREEMENT GATE. Core novelty.\n│   ├── canary.py                  &lt;- indirect-injection tripwire\n│   ├── adversarial/\n│   │   ├── mutators.py            &lt;- perturbation operators\n│   │   └── loop.py                &lt;- self-adversarial calibration loop\n│   ├── api/\n│   │   ├── main.py                &lt;- FastAPI app\n│   │   ├── routes_detect.py\n│   │   ├── routes_proxy.py        &lt;- pass-through to upstream LLM\n│   │   └── routes_admin.py\n│   ├── storage/\n│   │   ├── models.py              &lt;- SQLAlchemy tables\n│   │   └── repo.py\n│   └── eval/\n│       ├── datasets.py            &lt;- loaders for every benchmark\n│       ├── metrics.py\n│       ├── runner.py              &lt;- runs the full ablation grid\n│       └── report.py              &lt;- emits the results tables and plots\n├── dashboard/                     &lt;- React + Vite + Tailwind\n├── notebooks/                     &lt;- exploration only, never imported by src\n├── tests/\n│   ├── unit/\n│   ├── integration/\n│   └── adversarial/               &lt;- attack regression suite\n└── docs/\n    ├── adr/                       &lt;- architecture decision records\n    ├── runbook.md\n    └── viva_prep.md<\u002Fpre>\n<p><strong>Branching:<\u002Fstrong> <code>main<\u002Fcode> is always deployable. Work on <code>feat/&lt;name&gt;-&lt;thing&gt;<\u002Fcode>. Squash-merge into <code>main<\u002Fcode> via PR. Tag releases <code>v0.1<\u002Fcode>, <code>v0.2<\u002Fcode> at each phase boundary so you can always demo a working older version if today's code is broken.<\u002Fp>\n<p><strong>Commits:<\u002Fstrong> conventional commits (<code>feat:<\u002Fcode>, <code>fix:<\u002Fcode>, <code>docs:<\u002Fcode>, <code>test:<\u002Fcode>, <code>chore:<\u002Fcode>). This makes your final report's development-history section write itself.<\u002Fp>\n<\u002Fsection>\n\n<section id=\"p5\">\n<h2 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:16pt;font-weight:700;color:#1f2a4d;margin:30px 0 10px;padding-bottom:6px;border-bottom:2px solid #2b3a67;line-height:1.25\"><span style=\"font-family:Consolas,monospace;font-size:13pt;color:#2b3a67;margin-right:12px\">5<\u002Fspan>Environment and Complete Library List<\u002Fh2>\n<h3 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:11.5pt;font-weight:700;color:#2b3a67;margin:18px 0 6px\">5.1 Base Setup<\u002Fh3>\n<ul>\n<li><strong>Python 3.11.<\u002Fstrong> Not 3.12 or 3.13; some ML wheels lag behind.<\u002Fli>\n<li><strong>uv<\u002Fstrong> for dependency management (much faster than pip, produces a lockfile).<\u002Fli>\n<li><strong>Node 20 LTS<\u002Fstrong> for the dashboard only.<\u002Fli>\n<li><strong>Docker Desktop<\u002Fstrong> with WSL2 backend on Windows.<\u002Fli>\n<\u002Ful>\n<pre style=\"margin:14px 0;background:#f6f7f9;border-left:3px solid #2b3a67;padding:12px 15px;font-family:Consolas,'Liberation Mono',Menlo,monospace;font-size:8.6pt;line-height:1.55;color:#22262f;white-space:pre-wrap;break-inside:avoid\"># One-time setup\nuv venv --python 3.11\nuv pip install -e \".[dev]\"\npre-commit install<\u002Fpre>\n<h3 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:11.5pt;font-weight:700;color:#2b3a67;margin:22px 0 6px\">5.2 Every Library, What It Is For, And Why<\u002Fh3>\n<h4 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt;font-weight:700;color:#1f2a4d;margin:16px 0 4px;letter-spacing:.03em\">5.2.1 Core detection and ML<\u002Fh4>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"width:20%\">Library<\u002Fsc-raw-th><sc-raw-th scope=\"col\" style=\"width:40%\">Purpose<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Notes<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td><code>torch<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Tensor backend for all models<\u002Fsc-raw-td><sc-raw-td>CPU build is fine for most of the project. Install the CUDA build only on the cloud GPU box.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>transformers<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Load GPT-2 for perplexity, DeBERTa guard models, small proxy LLMs<\u002Fsc-raw-td><sc-raw-td>The single most-used library here.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>sentence-transformers<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Turn a prompt into a meaning-vector for Channels B and E<\u002Fsc-raw-td><sc-raw-td>Use <code>all-MiniLM-L6-v2<\u002Fcode> (fast, 384-dim) as default.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>tokenizers<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Fast tokenisation<\u002Fsc-raw-td><sc-raw-td>Pulled in by <code>transformers<\u002Fcode>.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>accelerate<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Device placement and memory-efficient loading<\u002Fsc-raw-td><sc-raw-td>Needed for the proxy model.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>scikit-learn<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Logistic regression, random forest, calibration (<code>CalibratedClassifierCV<\u002Fcode>), all metrics<\u002Fsc-raw-td><sc-raw-td>Channel B head and the entire calibration layer.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>numpy<\u002Fcode>, <code>pandas<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Arrays and dataframes<\u002Fsc-raw-td><sc-raw-td>Everywhere.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>scipy<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Statistical tests, distance functions<\u002Fsc-raw-td><sc-raw-td>For significance testing in evaluation.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>xgboost<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Optional stronger classifier head for Channel B<\u002Fsc-raw-td><sc-raw-td>Only if logistic regression underperforms. Try simple first.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>optuna<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Threshold and hyperparameter search<\u002Fsc-raw-td><sc-raw-td>Used to tune the disagreement band.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>sentencepiece<\u002Fcode>, <code>protobuf<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Tokeniser dependencies for some HF models<\u002Fsc-raw-td><sc-raw-td>Silent failures without these.<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<h4 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt;font-weight:700;color:#1f2a4d;margin:16px 0 4px;letter-spacing:.03em\">5.2.2 Attack generation and perturbation<\u002Fh4>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"width:26%\">Library<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Purpose<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td><code>nlpaug<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Character-level and word-level perturbations (typos, swaps, synonyms) for the behavioural probe and the adversarial loop<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>textattack<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Richer adversarial transformations and constraint framework. Heavy; use selectively<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>nltk<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>WordNet synonyms, tokenisation helpers for perturbation operators<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>homoglyphs<\u002Fcode> or a hand-built Unicode confusables map<\u002Fsc-raw-td><sc-raw-td>Character-obfuscation attacks (Cyrillic 'а' for Latin 'a') for the evasion test suite<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>garak<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>NVIDIA's LLM vulnerability scanner. Run it <strong>against our own detector<\u002Fstrong> for the red-team phase<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>pyrit<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Microsoft's red-teaming orchestrator. Optional, for multi-turn probing beyond scope<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>promptfoo<\u002Fcode> (npm)<\u002Fsc-raw-td><sc-raw-td>Application-layer red-team runs wired into CI<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<h4 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt;font-weight:700;color:#1f2a4d;margin:16px 0 4px;letter-spacing:.03em\">5.2.3 API, storage, serving<\u002Fh4>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"width:26%\">Library<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Purpose<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td><code>fastapi<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>The detection API and the LLM proxy<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>uvicorn[standard]<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>ASGI server<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>pydantic<\u002Fcode>, <code>pydantic-settings<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Request/response schemas and typed configuration<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>sqlalchemy<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>ORM for the audit log<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>alembic<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Database migrations<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>psycopg[binary]<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>PostgreSQL driver<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>redis<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Cache detection scores for repeated prompts; keeps latency low<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>httpx<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Async HTTP client for upstream LLM calls<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>tenacity<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Retry with backoff on flaky API calls<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>slowapi<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Rate limiting on the API<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>python-multipart<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>File/document upload for the indirect-injection path<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<h4 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt;font-weight:700;color:#1f2a4d;margin:16px 0 4px;letter-spacing:.03em\">5.2.4 LLM providers (for Channel D judge and the proxy target)<\u002Fh4>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"width:26%\">Library<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Purpose<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td><code>anthropic<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Claude API as judge and/or protected target<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>openai<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>OpenAI API, same roles<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>ollama<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Run a small local model with zero API cost. <strong>Strongly recommended<\u002Fstrong> for the behavioural probe<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>litellm<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Optional single interface over all providers, keeps the code model-agnostic<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<h4 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt;font-weight:700;color:#1f2a4d;margin:16px 0 4px;letter-spacing:.03em\">5.2.5 Observability, DevOps, quality<\u002Fh4>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"width:26%\">Library<\u002Fsc-raw-th><sc-raw-th scope=\"col\">Purpose<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr><sc-raw-td><code>structlog<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Structured JSON logs, so the dashboard can parse them<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>prometheus-client<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Expose latency, throughput, escalation-rate counters<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>opentelemetry-sdk<\u002Fcode>, <code>opentelemetry-instrumentation-fastapi<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Distributed tracing per request, so you can see exactly where the milliseconds go<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>mlflow<\u002Fcode> or <code>wandb<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Experiment tracking for every classifier training run. Pick <strong>one<\u002Fstrong>. MLflow runs fully offline, W&amp;B has nicer sharing<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>pytest<\u002Fcode>, <code>pytest-cov<\u002Fcode>, <code>pytest-asyncio<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Testing<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>hypothesis<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Property-based testing (great for the normaliser: \"normalising twice equals normalising once\")<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>ruff<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Linting and formatting, replaces black + flake8 + isort<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>mypy<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Static type checking<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>pre-commit<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Runs ruff/mypy/secret-scan before every commit<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>bandit<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Python security linter<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>pip-audit<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Flags dependencies with known CVEs<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>detect-secrets<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Stops an API key being committed. Non-negotiable<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>locust<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Load testing to measure throughput under concurrency<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>matplotlib<\u002Fcode>, <code>seaborn<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>ROC curves, reliability diagrams, ablation plots for the report<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<sc-raw-tr><sc-raw-td><code>rich<\u002Fcode>, <code>typer<\u002Fcode><\u002Fsc-raw-td><sc-raw-td>Nice CLI for the eval runner<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<h4 style=\"font-family:'Segoe UI',Helvetica,sans-serif;font-size:9.6pt;font-weight:700;color:#1f2a4d;margin:16px 0 4px;letter-spacing:.03em\">5.2.6 Dashboard (Node)<\u002Fh4>\n<sc-raw-table>\n<sc-raw-thead><sc-raw-tr><sc-raw-th scope=\"col\" style=\"width:26%\">Package<\u002Fsc-raw-th><sc
