# Alembic configuration. Schema changes go through migrations only;
# nobody runs manual SQL against a shared database (final_plan.md Part 8).

[alembic]
script_location = alembic
sqlalchemy.url = sqlite:///./dgad.db

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
